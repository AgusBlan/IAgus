<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agus IA - Recuerda TODO + Buscador</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffc7dd">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff6f8;color:#2a2a2a;display:flex;min-height:100vh}
.sidebar{width:200px;background:#ffc7dd;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.side-btn{border:none;padding:11px;border-radius:15px;text-align:left;font-weight:bold;font-size:13px;cursor:pointer}
.side-btn.active{outline:3px solid white}
.main{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0}
#chat{flex:1;background:white;border-radius:18px;padding:14px;border:2px dashed #ffc7dd;min-height:300px;overflow-y:auto}
.msg{padding:10px;border-radius:12px;margin:8px 0;word-break:break-word;white-space:pre-wrap}
.vos{background:#fff0a8}.ia{background:#ffe3ee}
textarea{width:100%;height:70px;padding:12px;border-radius:12px;border:2px solid #ffc7dd;font-size:17px;font-family:Arial;resize:none;background:white}
.btn{width:100%;padding:13px;border:none;border-radius:15px;font-weight:bold;margin-top:8px;font-size:14px;cursor:pointer}
input{width:100%;padding:10px;border-radius:12px;border:2px solid #ffc7dd}
.tarea{background:white;padding:10px;border-radius:12px;margin:6px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.tarea.hecha{opacity:0.5;text-decoration:line-through}
</style>
</head>
<body>
<div class="sidebar">
<h3 style="text-align:center;background:white;border-radius:15px;padding:8px">🌸 Agus IA<br><span style="font-size:11px">Recuerda TODO + Busca rápido</span></h3>
<p style="background:white;padding:8px;border-radius:12px;font-size:12px;text-align:center;margin:0">✅ Gemini sin código<br>✅ Recuerda TODO<br>✅ Buscador rápido</p>
<div style="background:white;padding:10px;border-radius:15px">
<b>🔍 Buscador rápido</b>
<input id="buscarInput" placeholder="Ej: fotosíntesis, Clefairy, mi cumple...">
<button class="btn" style="background:#a8e0ff" onclick="buscarRapido()">🔍 Buscar</button>
<div id="resultadoBuscar" style="font-size:12px;margin-top:6px;white-space:pre-wrap"></div>
</div>
<div style="background:white;padding:10px;border-radius:15px">
<b>📅 Hoy</b>
<div id="hoyBox" style="font-size:12px;margin-top:6px"></div>
<button class="btn" style="background:#ffc7dd" onclick="resumenDia()">✨ Organizame el día</button>
</div>
<div style="background:white;padding:10px;border-radius:15px">
<b>✅ Mis tareas</b>
<input id="nuevaTarea" placeholder="Ej: Estudiar para mañana">
<button class="btn" style="background:#b8f1cc" onclick="agregarTareaManual()">+ Agregar tarea</button>
<div id="listaTareas"></div>
</div>
<div id="listaChats"></div>
<button class="btn" style="background:white" onclick="crearChat()">+ Crear chat</button>
<button class="btn" style="background:#ffcf9e" onclick="mostrarPerfil()">👤 Mi perfil</button>
<div id="perfilBox" style="display:none;background:white;padding:10px;border-radius:15px">
<textarea id="miPerfilTexto" style="height:120px" placeholder="Contame vos..."></textarea>
<button class="btn" style="background:#ff8fb8;color:white" onclick="guardarPerfil()">Guardar</button>
</div>
<button class="btn" style="background:#ff8fb8;color:white" onclick="borrarTodo()">🗑️ Borrar TODO</button>
</div>
<div class="main">
<div id="chat"></div>
<p id="estadoIA" style="font-size:13px;text-align:center;font-weight:bold">✅ Lista - Recuerda TODO, busca rápido</p>
<textarea id="entrada" placeholder="Hablame... Ej: ¿Qué es la fotosíntesis? ¿Qué me dijiste ayer? Organizame el día"></textarea>
<button class="btn" style="background:#ff8fb8;color:white" onclick="hablar()">ENVIAR</button>
<button class="btn" style="background:#e2c6ff" onclick="leerUltimo()">🔊 Leeme lo último</button>
</div>
<script>
var mensajesMostrados=[], chats={}, orden=[], memoriaAprendida=[], sec="general", colores=["#b8f1cc","#fff0a8","#ffcf9e","#a8e0ff","#a8f0b8","#e2c6ff"];
var miPerfil="", tareas=[];
try{
  miPerfil=localStorage.getItem("miPerfilAgus")||"";
  var c1=localStorage.getItem("chatsAgusV2"); if(c1) chats=JSON.parse(c1);
  var o1=localStorage.getItem("ordenAgus"); if(o1) orden=JSON.parse(o1);
  var m1=localStorage.getItem("memoriaAprendidaAgus"); if(m1) memoriaAprendida=JSON.parse(m1);
  var t1=localStorage.getItem("tareasAgus"); if(t1) tareas=JSON.parse(t1);
}catch(e){}
if(!orden||orden.length===0){
  orden=[{id:"general",nombre:"General",emoji:"💖"},{id:"libros",nombre:"Libros",emoji:"📚"},{id:"videos",nombre:"Videos",emoji:"🎬"},{id:"facu",nombre:"Facu",emoji:"🎓"},{id:"gim",nombre:"Gim",emoji:"🏋️"},{id:"diario",nombre:"Diario",emoji:"📓"},{id:"agenda",nombre:"Agenda",emoji:"📅"}];
  chats={}; for(var i=0;i<orden.length;i++) chats[orden[i].id]=[]; sec="general";
} else { sec=orden[0].id; for(var k=0;k<orden.length;k++){ if(!chats[orden[k].id]) chats[orden[k].id]=[]; } }
// RECUERDA TODO - guarda hasta 5000 cosas, no borra nada
function aprenderDeVos(t){ if(!t||t.trim().length<2) return; memoriaAprendida.push({fecha:Date.now(),texto:t,seccion:sec}); if(memoriaAprendida.length>5000) memoriaAprendida=memoriaAprendida.slice(-5000); guardar(); }
function guardar(){ try{ localStorage.setItem("chatsAgusV2",JSON.stringify(chats)); localStorage.setItem("ordenAgus",JSON.stringify(orden)); localStorage.setItem("memoriaAprendidaAgus",JSON.stringify(memoriaAprendida)); localStorage.setItem("miPerfilAgus",miPerfil); localStorage.setItem("tareasAgus",JSON.stringify(tareas)); }catch(e){} }
// BUSCADOR RÁPIDO - busca en tu memoria + en Wikipedia + en internet
async function buscarEnMemoria(q){
  var qq=q.toLowerCase();
  var encontrados=[];
  for(var i=0;i<memoriaAprendida.length;i++){ if(memoriaAprendida[i].texto.toLowerCase().indexOf(qq)>=0) encontrados.push(memoriaAprendida[i].texto); }
  if(miPerfil.toLowerCase().indexOf(qq)>=0) encontrados.push("Mi perfil: "+miPerfil);
  for(var j=0;j<tareas.length;j++){ if(tareas[j].texto.toLowerCase().indexOf(qq)>=0) encontrados.push("Tarea: "+tareas[j].texto); }
  return encontrados;
}
async function buscarRapido(){
  var q=document.getElementById("buscarInput").value.trim();
  if(!q) return;
  document.getElementById("resultadoBuscar").innerText="Buscando...";
  var mem=await buscarEnMemoria(q);
  var txt="";
  if(mem.length>0){ txt+="🧠 En tu memoria encontré:\n"+mem.slice(-5).join("\n")+"\n\n"; }
  try{
    var w=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q));
    if(w.ok){ var d=await w.json(); if(d.extract) txt+="📚 Wikipedia:\n"+d.extract.slice(0,800)+"\n\n"; }
  }catch(e){}
  try{
    var dd=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1&skip_disambig=1");
    var ddj=await dd.json();
    if(ddj.AbstractText) txt+="🌐 Internet:\n"+ddj.AbstractText.slice(0,800)+"\n";
  }catch(e){}
  if(!txt) txt="No encontré nada de "+q+", ¿me contás vos qué es?";
  document.getElementById("resultadoBuscar").innerText=txt;
  aprenderDeVos("Agus buscó: "+q);
}
function agregarTareaManual(){ var v=document.getElementById("nuevaTarea").value.trim(); if(!v) return; tareas.push({id:Date.now(),texto:v,hecha:false,fecha:Date.now()}); document.getElementById("nuevaTarea").value=""; guardar(); renderTareas(); aprenderDeVos("Mi tarea es: "+v); }
function renderTareas(){ var h=""; for(var i=0;i<tareas.length;i++){ var t=tareas[i]; h+='<div class="tarea '+(t.hecha?"hecha":"")+'"><span onclick="toggleTarea('+t.id+')"> '+(t.hecha?"✅":"⬜")+' '+t.texto+'</span><span onclick="borrarTarea('+t.id+')" style="cursor:pointer">✕</span></div>'; } document.getElementById("listaTareas").innerHTML=h||"<p style='font-size:12px'>Sin tareas</p>"; actualizarHoy(); }
function toggleTarea(id){ for(var i=0;i<tareas.length;i++){ if(tareas[i].id===id) tareas[i].hecha=!tareas[i].hecha; } guardar(); renderTareas(); }
function borrarTarea(id){ tareas=tareas.filter(function(t){return t.id!==id}); guardar(); renderTareas(); }
function actualizarHoy(){ var pendientes=tareas.filter(function(t){return !t.hecha}); var hoy=new Date(); var dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"]; document.getElementById("hoyBox").innerHTML="Hoy es "+dias[hoy.getDay()]+", "+hoy.getDate()+"/"+(hoy.getMonth()+1)+"<br>Tenés "+pendientes.length+" tareas<br>"+(pendientes.length?pendientes.map(function(t){return "• "+t.texto}).join("<br>"):"¡Sin pendientes!"); }
function resumenDia(){ hablarConIA("Organizame el día").then(function(r){ agregarMensaje("Agus IA",r); }); }
function detectarTarea(mensaje){
  var m=mensaje.toLowerCase();
  if(m.includes("agreg")&& (m.includes("tarea")||m.includes("record")||m.includes("anot"))){
    var texto=mensaje.replace(/agreg[aá] (tarea|recordatorio|anotar|a mi agenda)[: ]?/i,"").trim();
    if(texto.length>2){ tareas.push({id:Date.now(),texto:texto,hecha:false,fecha:Date.now()}); guardar(); renderTareas(); return "Listo, ya te lo anoté y lo recuerdo: "+texto; }
  }
  if(m.includes("mis tareas")||m.includes("que tengo que hacer")||m.includes("que me falta")){
    if(tareas.length===0) return "No tenés tareas pendientes";
    var p=tareas.filter(function(t){return !t.hecha});
    if(p.length===0) return "Ya hiciste todo, ¡genia!";
    return "Tenés estas tareas:\n"+p.map(function(t,i){return (i+1)+". "+t.texto}).join("\n");
  }
  return null;
}
function respuestaRapida(mensaje){
  var m=mensaje.toLowerCase().trim();
  if(/^(hola+|holis|hey|buenas|holaaa+)[\s\!\?💖😊]*$/.test(m)) return "Holaa 💖 ¿Cómo andás? Soy tu organizadora, recuerdo TODO lo que me decís y busco rápido. ¿Qué querés buscar o que te organice?";
  if(m.includes("como estas")||m.includes("como andas")) return "Estoy re bien, gracias por preguntar 💖 ¿Vos cómo andás? ¿Querés que busque algo o que te organice el día?";
  if(m.includes("organizame")||m.includes("organiza mi dia")){
    var p=tareas.filter(function(t){return !t.hecha});
    if(p.length===0) return "Hoy no tenés tareas pendientes, ¡podés descansar! ¿Querés que te agregue algo?";
    return "Dale, te organizo el día 💖 Tenés esto:\n"+p.map(function(t,i){return (i+1)+". "+t.texto}).join("\n")+"\n¿Empezamos por la primera?";
  }
  return null;
}
function agregarMensaje(quien,texto){ mensajesMostrados.push({q:quien,t:texto}); mostrarChat(); try{ if(!chats[sec]) chats[sec]=[]; chats[sec].push({q:quien,t:texto}); guardar(); }catch(e){} }
function construirMemoria(){
  var mem="";
  if(miPerfil) mem+="Perfil de Agus (recuerdo todo): "+miPerfil+"\n";
  mem+="TAREAS:\n";
  for(var ti=0;ti<tareas.length;ti++) mem+="- "+(tareas[ti].hecha?"[HECHA] ":"[PENDIENTE] ")+tareas[ti].texto+"\n";
  mem+="TODO LO QUE ME DIJO AGUS (TODA LA HISTORIA, HASTA 5000):\n";
  for(var j=0;j<memoriaAprendida.length;j++) mem+="- "+memoriaAprendida[j].texto+"\n";
  mem+="CHAT ACTUAL:\n";
  for(var k=0;k<mensajesMostrados.length;k++){ if(mensajesMostrados[k].t.indexOf("pensando")>=0) continue; mem+=mensajesMostrados[k].q+": "+mensajesMostrados[k].t.replace(/<[^>]*>/g,"")+"\n"; }
  return mem;
}
function mostrarChat(){ var chat=document.getElementById("chat"); if(!chat) return; var h=""; for(var i=0;i<mensajesMostrados.length;i++){ var m=mensajesMostrados[i]; var cls=(m.q==="Vos"?"vos":"ia"); h+='<div class="msg '+cls+'"><b>'+m.q+':</b> '+m.t+'</div>'; } chat.innerHTML=h; chat.scrollTop=999999; }
function hablar(){ var el=document.getElementById("entrada"); if(!el) return; var mensaje=el.value.trim(); if(!mensaje) return; el.value=""; agregarMensaje("Vos",mensaje); aprenderDeVos(mensaje); mensajesMostrados.push({q:"Agus IA",t:"💭 buscando..."}); mostrarChat(); responderIA(mensaje); }
async function responderIA(mensaje){
  var rapida=respuestaRapida(mensaje);
  if(rapida){ mensajesMostrados.pop(); agregarMensaje("Agus IA",rapida); return; }
  var tareaDetectada=detectarTarea(mensaje);
  if(tareaDetectada){ mensajesMostrados.pop(); agregarMensaje("Agus IA",tareaDetectada); return; }
  try{
    var r=await Promise.race([hablarConIA(mensaje), new Promise(function(res){ setTimeout(function(){ res("Estoy acá 💖 ¿Me repetís eso? Quiero buscarte bien."); }, 10000); })]);
    mensajesMostrados.pop(); agregarMensaje("Agus IA",r); aprenderDeVos("Agus IA respondió: "+r);
  }catch(e){ mensajesMostrados.pop(); agregarMensaje("Agus IA","Estoy acá 💖 ¿Me repetís eso?"); }
}
function esValida(txt){ if(!txt) return false; var t=txt.trim().toLowerCase(); if(t.length<2) return false; if(t.includes("404")||t.includes("not found")||t.includes("<html")) return false; return true; }
async function buscarEnInternet(q){
  var info="";
  try{ var w=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q)); if(w.ok){ var d=await w.json(); if(d.extract) info+="Wikipedia: "+d.extract.slice(0,1000)+"\n"; } }catch(e){}
  try{ var dd=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1&skip_disambig=1"); var ddj=await dd.json(); if(ddj.AbstractText) info+="Internet: "+ddj.AbstractText.slice(0,1000)+"\n"; }catch(e){}
  return info;
}
async function hablarConIA(mensaje){
  var memoria=construirMemoria();
  // Si pregunta algo, busca primero en tu memoria y en internet, y después responde con eso
  var infoInternet="";
  var esCharla=/^(hola+|holis|hey|buenas|como estas|como andas|todo bien|funcionas|que onda|que haces)[\s\?\!💖😊]*$/i.test(mensaje.toLowerCase().trim());
  if(!esCharla) infoInternet=await buscarEnInternet(mensaje);
  var memEncontrada=await buscarEnMemoria(mensaje);
  var prompt="Sos Agus IA, organizadora personal de Agus. Sos inteligente, madura, clara. Recordás TODO lo que te dice Agus, y buscás rápido en internet. Respondé por vos misma, usando lo que encontraste en su memoria y en internet. Memoria de Agus: "+memoria.slice(0,4000)+"\nEn su memoria encontraste: "+memEncontrada.slice(-5).join(" | ")+"\nEn internet encontraste: "+infoInternet+"\nAgus dice: "+mensaje;
  try{
    var r=await fetch("https://text.pollinations.ai/"+encodeURIComponent(prompt),{method:"GET"});
    if(r.ok){ var t=await r.text(); if(esValida(t)) return t.slice(0,2500); }
  }catch(e){}
  try{
    var r2=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"gemini",messages:[{role:"system",content:"Sos Agus IA, recordás todo y buscás rápido."},{role:"user",content:prompt}],temperature:0.8,max_tokens:1200})});
    if(r2.ok){ var d=await r2.json(); var tp=d.choices&&d.choices[0]&&d.choices[0].message?d.choices[0].message.content:""; if(esValida(tp)) return tp; }
  }catch(e){}
  // Si no anda internet, responde con lo que recuerda
  if(memEncontrada.length>0) return "En tu memoria encontré esto de eso:\n"+memEncontrada.slice(-3).join("\n");
  if(infoInternet) return infoInternet;
  return "Estoy acá 💖 Contame, ¿qué querés que busque o que te organice?";
}
function renderLista(){ try{ var h=""; for(var i=0;i<orden.length;i++){ var c=orden[i]; var cls=(c.id===sec?"side-btn active":"side-btn"); h+='<button class="'+cls+'" style="background:'+colores[i%colores.length]+'" onclick="cambiar(\''+c.id+'\')"> '+c.emoji+' '+c.nombre+' <span onclick="event.stopPropagation();borrarChat(\''+c.id+'\')">✕</span></button>'; } document.getElementById("listaChats").innerHTML=h; }catch(e){} }
function crearChat(){ var n=prompt("Nombre del chat"); if(!n) return; var e=prompt("Emoji")||"💖"; var id="chat_"+Date.now(); chats[id]=[]; orden.push({id:id,nombre:n,emoji:e}); sec=id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function borrarChat(id){ if(!confirm("¿Borrar?")) return; delete chats[id]; var nuevo=[]; for(var i=0;i<orden.length;i++){ if(orden[i].id!==id) nuevo.push(orden[i]); } orden=nuevo; if(orden.length===0){ var nid="chat_"+Date.now(); chats[nid]=[]; orden=[{id:nid,nombre:"General",emoji:"💖"}]; } sec=orden[0].id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function cambiar(id){ sec=id; renderLista(); mensajesMostrados=[]; var lista=chats[sec]||[]; for(var i=0;i<lista.length;i++){ mensajesMostrados.push(lista[i]); } mostrarChat(); }
function mostrarPerfil(){ var d=document.getElementById("perfilBox"); if(d.style.display==="block") d.style.display="none"; else { d.style.display="block"; document.getElementById("miPerfilTexto").value=miPerfil; } }
function guardarPerfil(){ miPerfil=document.getElementById("miPerfilTexto").value.trim(); try{ localStorage.setItem("miPerfilAgus",miPerfil); }catch(e){} aprenderDeVos("Mi perfil es: "+miPerfil); document.getElementById("perfilBox").style.display="none"; }
function borrarTodo(){ if(!confirm("¿Borrar TODO lo mío?")) return; try{ localStorage.removeItem("miPerfilAgus"); localStorage.removeItem("chatsAgusV2"); localStorage.removeItem("ordenAgus"); localStorage.removeItem("memoriaAprendidaAgus"); localStorage.removeItem("tareasAgus"); }catch(e){} location.reload(); }
function leerUltimo(){ try{ var chat=document.getElementById("chat"); var voz=new SpeechSynthesisUtterance(chat.innerText.slice(-500)); voz.lang="es-AR"; speechSynthesis.speak(voz); }catch(e){} }
try{ document.getElementById("entrada").addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); hablar(); } }); document.getElementById("buscarInput").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); buscarRapido(); } }); }catch(e){}
try{ renderLista(); renderTareas(); mostrarChat(); }catch(e){}
</script>
</body>
</html>

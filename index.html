<script type="module">
import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";
window.engine=null; window.cargando=false;
window.cargarIA=async function(){
  if(window.engine) return; if(window.cargando) return; window.cargando=true;
  document.getElementById("estadoIA").innerText="⬇️ Descargando...";
  try{
    window.engine=await CreateMLCEngine("Qwen2.5-1.5B-Instruct-q4f16_1-MLC",{initProgressCallback:(p)=>{document.getElementById("estadoIA").innerText="⬇️ "+Math.round(p.progress*100)+"%";}});
    document.getElementById("estadoIA").innerText="✅ Listo";
    window.cargando=false;
  }catch(e){ document.getElementById("estadoIA").innerText="No se pudo, intentá de nuevo"; window.cargando=false; }
};
</script>
<script>
var modoActual="rapido";
var mensajesMostrados=[], chats={}, orden=[], memoriaAprendida=[], lecciones=[], sec="general", colores=["#b8f1cc","#fff0a8","#ffcf9e","#a8e0ff","#a8f0b8","#e2c6ff"];
var miPerfil="", tareas=[];
try{
  miPerfil=localStorage.getItem("miPerfilAgus")||"";
  var c1=localStorage.getItem("chatsAgusV2"); if(c1) chats=JSON.parse(c1);
  var o1=localStorage.getItem("ordenAgus"); if(o1) orden=JSON.parse(o1);
  var m1=localStorage.getItem("memoriaAprendidaAgus"); if(m1) memoriaAprendida=JSON.parse(m1);
  var l1=localStorage.getItem("leccionesAgus"); if(l1) lecciones=JSON.parse(l1);
  var t1=localStorage.getItem("tareasAgus"); if(t1) tareas=JSON.parse(t1);
  var k1=localStorage.getItem("geminiKeyAgus"); if(k1) document.getElementById("apiKey").value=k1;
}catch(e){}
if(!orden||orden.length===0){
  orden=[{id:"general",nombre:"General",emoji:"💖"},{id:"libros",nombre:"Libros",emoji:"📚"},{id:"videos",nombre:"Videos",emoji:"🎬"},{id:"facu",nombre:"Facu",emoji:"🎓"},{id:"gim",nombre:"Gim",emoji:"🏋️"},{id:"diario",nombre:"Diario",emoji:"📓"},{id:"agenda",nombre:"Agenda",emoji:"📅"}];
  chats={}; for(var i=0;i<orden.length;i++) chats[orden[i].id]=[]; sec="general";
} else { sec=orden[0].id; for(var k=0;k<orden.length;k++){ if(!chats[orden[k].id]) chats[orden[k].id]=[]; } }
function guardarKey(){ var k=document.getElementById("apiKey").value.trim().replace(/\s/g,""); if(!k){ alert("Pegá el código primero"); return; } localStorage.setItem("geminiKeyAgus",k); document.getElementById("apiKey").value=k; document.getElementById("estadoIA").innerText="✅ Código guardado (falta probar si anda)"; document.getElementById("resultadoCodigo").innerText="Guardado. Ahora tocá 🔍 Probar si mi código anda"; }
function borrarKey(){ localStorage.removeItem("geminiKeyAgus"); document.getElementById("apiKey").value=""; document.getElementById("estadoIA").innerText="✅ Código borrado, usa sin código"; document.getElementById("resultadoCodigo").innerText=""; }
async function probarCodigo(){
  var k=(document.getElementById("apiKey").value||"").trim().replace(/\s/g,"");
  var res=document.getElementById("resultadoCodigo");
  if(!k){ res.innerText="No hay código pegado"; return; }
  res.innerText="Probando... esperá 3 segundos...";
  try{
    var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+k,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:"Decí Hola"}]}]})});
    var d=await r.json();
    if(r.ok && d.candidates && d.candidates[0]){
      res.innerText="✅ ¡ANDA! Tu código funciona al 10000%. Ya podés hablar tranquila.";
      document.getElementById("estadoIA").innerText="✅ Código anda al 10000%";
    } else {
      var msg=d.error?d.error.message:"Error desconocido";
      res.innerText="❌ NO ANDA. Google dice: "+msg+". Si dice API key not valid, es que copiaste otro código, no el de Gemini. El bueno empieza con AIza.";
      document.getElementById("estadoIA").innerText="❌ Código no anda";
    }
  }catch(e){ res.innerText="❌ No se pudo probar, fijate tu internet. Error: "+e.message; }
}
function mostrarConfig(){ var d=document.getElementById("configBox"); d.style.display=(d.style.display==="block"?"none":"block"); }
function aprenderDeVos(t){ if(!t||t.trim().length<3) return; memoriaAprendida.push({fecha:Date.now(),texto:t,seccion:sec}); if(memoriaAprendida.length>1000) memoriaAprendida=memoriaAprendida.slice(-1000); guardar(); }
function guardar(){ try{ localStorage.setItem("chatsAgusV2",JSON.stringify(chats)); localStorage.setItem("ordenAgus",JSON.stringify(orden)); localStorage.setItem("memoriaAprendidaAgus",JSON.stringify(memoriaAprendida)); localStorage.setItem("leccionesAgus",JSON.stringify(lecciones)); localStorage.setItem("miPerfilAgus",miPerfil); localStorage.setItem("tareasAgus",JSON.stringify(tareas)); }catch(e){} }
function agregarTareaManual(){ var v=document.getElementById("nuevaTarea").value.trim(); if(!v) return; tareas.push({id:Date.now(),texto:v,hecha:false,fecha:Date.now()}); document.getElementById("nuevaTarea").value=""; guardar(); renderTareas(); aprenderDeVos("Mi tarea es: "+v); }
function renderTareas(){ var h=""; for(var i=0;i<tareas.length;i++){ var t=tareas[i]; h+='<div class="tarea '+(t.hecha?"hecha":"")+'"><span onclick="toggleTarea('+t.id+')"> '+(t.hecha?"✅":"⬜")+' '+t.texto+'</span><span onclick="borrarTarea('+t.id+')" style="cursor:pointer">✕</span></div>'; } document.getElementById("listaTareas").innerHTML=h||"<p style='font-size:12px'>Sin tareas</p>"; actualizarHoy(); }
function toggleTarea(id){ for(var i=0;i<tareas.length;i++){ if(tareas[i].id===id) tareas[i].hecha=!tareas[i].hecha; } guardar(); renderTareas(); }
function borrarTarea(id){ tareas=tareas.filter(function(t){return t.id!==id}); guardar(); renderTareas(); }
function actualizarHoy(){ var pendientes=tareas.filter(function(t){return !t.hecha}); var hoy=new Date(); var dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"]; document.getElementById("hoyBox").innerHTML="Hoy es "+dias[hoy.getDay()]+", "+hoy.getDate()+"/"+(hoy.getMonth()+1)+"<br>Tenés "+pendientes.length+" tareas<br>"+(pendientes.length?pendientes.map(function(t){return "• "+t.texto}).join("<br>"):"¡Sin pendientes!"); }
function resumenDia(){ hablarConIA("Organizame el día").then(function(r){ agregarMensaje("Agus IA",r); }); }
function detectarTarea(mensaje){
  var m=mensaje.toLowerCase();
  if(m.includes("agreg")&& (m.includes("tarea")||m.includes("record")||m.includes("anot"))){
    var texto=mensaje.replace(/agreg[aá] (tarea|recordatorio|anotar|a mi agenda)[: ]?/i,"").trim();
    if(texto.length>2){ tareas.push({id:Date.now(),texto:texto,hecha:false,fecha:Date.now()}); guardar(); renderTareas(); return "Listo, ya te lo anoté: "+texto; }
  }
  if(m.includes("mis tareas")||m.includes("que tengo que hacer")||m.includes("que me falta")){
    if(tareas.length===0) return "No tenés tareas pendientes";
    var p=tareas.filter(function(t){return !t.hecha});
    if(p.length===0) return "Ya hiciste todo, ¡genia!";
    return "Tenés estas tareas:\n"+p.map(function(t,i){return (i+1)+". "+t.texto}).join("\n");
  }
  return null;
}
function respuestaRapida(mensaje){
  var m=mensaje.toLowerCase().trim();
  if(/^(hola+|holis|hey|buenas|holaaa+)[\s\!\?💖😊]*$/.test(m)) return "Holaa 💖 ¿Cómo andás? Soy tu organizadora, ¿en qué te ayudo hoy? Podés decirme que te agregue una tarea o que te organice el día.";
  if(m.includes("como estas")||m.includes("como andas")) return "Estoy re bien, gracias por preguntar 💖 ¿Vos cómo andás? ¿Querés que te organice el día?";
  if(m.includes("funciona el codigo")||m.includes("funciona el código")||m.includes("anda el codigo")){
    var kk=localStorage.getItem("geminiKeyAgus")||"";
    if(!kk) return "No tenés ningún código guardado. Tocá ⚙️ Poner código y pegalo ahí, después tocá 🔍 Probar si mi código anda.";
    return "Tenés un código guardado que empieza con "+kk.slice(0,4)+"... Para saber si anda de verdad, tocá ⚙️ Poner código y después 🔍 Probar si mi código anda. Ahí te dice si anda o si Google lo rechaza.";
  }
  if(m.includes("organizame")||m.includes("organiza mi dia")){
    var p=tareas.filter(function(t){return !t.hecha});
    if(p.length===0) return "Hoy no tenés tareas pendientes, ¡podés descansar!";
    return "Dale, te organizo el día 💖 Tenés esto:\n"+p.map(function(t,i){return (i+1)+". "+t.texto}).join("\n");
  }
  return null;
}
function agregarMensaje(quien,texto){ mensajesMostrados.push({q:quien,t:texto}); mostrarChat(); try{ if(!chats[sec]) chats[sec]=[]; chats[sec].push({q:quien,t:texto}); guardar(); }catch(e){} }
function construirMemoria(){
  var mem="";
  if(miPerfil) mem+="Perfil: "+miPerfil+"\n";
  mem+="TAREAS:\n";
  for(var ti=0;ti<tareas.length;ti++) mem+="- "+(tareas[ti].hecha?"[HECHA] ":"[PENDIENTE] ")+tareas[ti].texto+"\n";
  mem+="TODO:\n";
  for(var j=0;j<memoriaAprendida.length;j++) mem+="- "+memoriaAprendida[j].texto+"\n";
  mem+="CHAT:\n";
  for(var k=0;k<mensajesMostrados.length;k++){ if(mensajesMostrados[k].t.indexOf("pensando")>=0) continue; mem+=mensajesMostrados[k].q+": "+mensajesMostrados[k].t.replace(/<[^>]*>/g,"")+"\n"; }
  return mem;
}
function cambiarModo(m){
  modoActual=m;
  var ba=document.getElementById("btnAdulta"), bp=document.getElementById("btnPrivado");
  if(m==="rapido"){ ba.classList.add("modo-activo"); bp.classList.remove("modo-activo"); document.getElementById("modoTexto").innerText="⚡ Rápido"; var kk=localStorage.getItem("geminiKeyAgus")||""; document.getElementById("estadoIA").innerText=kk?"✅ Con código guardado, probalo":"✅ Sin código, anda igual"; }
  else { bp.classList.add("modo-activo"); ba.classList.remove("modo-activo"); document.getElementById("modoTexto").innerText="🔒 Privado"; if(window.engine) document.getElementById("estadoIA").innerText="✅ Listo"; else document.getElementById("estadoIA").innerText="Tocá ⬇️ Descargar cerebro 1.5B"; }
}
function mostrarChat(){ var chat=document.getElementById("chat"); if(!chat) return; var h=""; for(var i=0;i<mensajesMostrados.length;i++){ var m=mensajesMostrados[i]; var cls=(m.q==="Vos"?"vos":"ia"); h+='<div class="msg '+cls+'"><b>'+m.q+':</b> '+m.t+'</div>'; } chat.innerHTML=h; chat.scrollTop=999999; }
function hablar(){ var el=document.getElementById("entrada"); if(!el) return; var mensaje=el.value.trim(); if(!mensaje) return; el.value=""; agregarMensaje("Vos",mensaje); aprenderDeVos(mensaje); mensajesMostrados.push({q:"Agus IA",t:"💭 pensando..."}); mostrarChat(); responderIA(mensaje); }
async function responderIA(mensaje){
  var rapida=respuestaRapida(mensaje);
  if(rapida){ mensajesMostrados.pop(); agregarMensaje("Agus IA",rapida); return; }
  var tareaDetectada=detectarTarea(mensaje);
  if(tareaDetectada){ mensajesMostrados.pop(); agregarMensaje("Agus IA",tareaDetectada); return; }
  try{
    var r=await Promise.race([hablarConIA(mensaje), new Promise(function(res){ setTimeout(function(){ res("Estoy acá 💖 ¿Me repetís eso? Quiero responderte bien."); }, 8000); })]);
    mensajesMostrados.pop(); agregarMensaje("Agus IA",r); aprenderDeVos("Agus IA respondió: "+r);
  }catch(e){ mensajesMostrados.pop(); agregarMensaje("Agus IA","Estoy acá 💖 ¿Me repetís eso?"); }
}
async function aprenderDelMundo(pregunta){
  var info=""; var q=pregunta.trim(); if(q.length<4) return "";
  var esCharla=/^(hola+|holis|hey|buenas|como estas|como andas|todo bien|funcionas|que onda|que haces)[\s\?\!💖😊]*$/i.test(q.toLowerCase());
  if(esCharla) return "";
  try{ var c1=new AbortController(); setTimeout(()=>c1.abort(),2000); var ddg=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1&skip_disambig=1",{signal:c1.signal}); var d=await ddg.json(); if(d.AbstractText) info+="Del mundo: "+d.AbstractText+"\n"; }catch(e){}
  try{ var c2=new AbortController(); setTimeout(()=>c2.abort(),2000); var wiki=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q),{signal:c2.signal}); if(wiki.ok){ var w=await wiki.json(); if(w.extract) info+="Wikipedia: "+w.extract.slice(0,1500)+"\n"; } }catch(e){}
  return info;
}
function esValida(txt){ if(!txt) return false; var t=txt.trim().toLowerCase(); if(t.length<2) return false; if(t.includes("404")||t.includes("not found")||t.includes("<html")) return false; return true; }
async function hablarConIA(mensaje){
  var memoria=construirMemoria();
  var infoMundo=await aprenderDelMundo(mensaje);
  var basePrompt="Sos Agus IA, la organizadora personal de Agus. Sos inteligente, madura, clara, sin infantilizar. Respondé por vos misma.";
  var key=localStorage.getItem("geminiKeyAgus")||"";
  if(modoActual==="rapido" && key && key.length>20){
    try{
      var prompt=basePrompt+"\n\nMemoria:\n"+memoria+"\n\nMundo:\n"+(infoMundo||"Sin info")+"\n\nAgus dice: "+mensaje;
      var resp=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      var data=await resp.json();
      var txt=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts[0].text?data.candidates[0].content.parts[0].text:"";
      if(esValida(txt)) return txt;
    }catch(e){}
  }
  if(modoActual==="rapido"){
    // Intento con GET, que a veces anda cuando el POST falla
    try{
      var promptGet=encodeURIComponent(basePrompt+" Memoria: "+memoria.slice(0,1000)+" Agus dice: "+mensaje);
      var rGet=await fetch("https://text.pollinations.ai/"+promptGet,{method:"GET"});
      if(rGet.ok){ var tGet=await rGet.text(); if(esValida(tGet)) return tGet.slice(0,2000); }
    }catch(e){}
    var modelos=["gemini","gemini-2.0-flash","openai"];
    for(var mi=0;mi<modelos.length;mi++){
      try{
        var ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),5000);
        var respP=await fetch("https://text.pollinations.ai/openai",{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({model:modelos[mi],messages:[{role:"system",content:basePrompt},{role:"user",content:"Memoria:\n"+memoria+"\nMundo:\n"+infoMundo+"\nAgus dice: "+mensaje}],temperature:0.8,max_tokens:800})});
        if(respP.ok){ var dp=await respP.json(); var tp=dp.choices&&dp.choices[0]&&dp.choices[0].message?dp.choices[0].message.content:""; if(esValida(tp)) return tp; }
      }catch(e){}
    }
    return "Estoy acá 💖 ¿Me repetís eso? Quiero ayudarte.";
  }
  if(!window.engine) return "Estás en Privado pero todavía no descargaste el cerebro. Tocá ⬇️ Descargar cerebro 1.5B abajo.";
  try{
    var respP2=await window.engine.chat.completions.create({messages:[{role:"system",content:basePrompt},{role:"user",content:"Memoria:\n"+memoria+"\nAgus dice: "+mensaje}],temperature:0.7,max_tokens:1000,repetition_penalty:1.15});
    var texto=respP2.choices[0].message.content||"";
    if(!esValida(texto)) return "Me trabé un segundo, ¿me repetís?";
    return texto;
  }catch(e){ return "Me trabé un segundo, ¿me repetís?"; }
}
function renderLista(){ try{ var h=""; for(var i=0;i<orden.length;i++){ var c=orden[i]; var cls=(c.id===sec?"side-btn active":"side-btn"); h+='<button class="'+cls+'" style="background:'+colores[i%colores.length]+'" onclick="cambiar(\''+c.id+'\')"> '+c.emoji+' '+c.nombre+' <span onclick="event.stopPropagation();borrarChat(\''+c.id+'\')">✕</span></button>'; } document.getElementById("listaChats").innerHTML=h; }catch(e){} }
function crearChat(){ var n=prompt("Nombre del chat"); if(!n) return; var e=prompt("Emoji")||"💖"; var id="chat_"+Date.now(); chats[id]=[]; orden.push({id:id,nombre:n,emoji:e}); sec=id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function borrarChat(id){ if(!confirm("¿Borrar?")) return; delete chats[id]; var nuevo=[]; for(var i=0;i<orden.length;i++){ if(orden[i].id!==id) nuevo.push(orden[i]); } orden=nuevo; if(orden.length===0){ var nid="chat_"+Date.now(); chats[nid]=[]; orden=[{id:nid,nombre:"General",emoji:"💖"}]; } sec=orden[0].id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function cambiar(id){ sec=id; renderLista(); mensajesMostrados=[]; var lista=chats[sec]||[]; for(var i=0;i<lista.length;i++){ mensajesMostrados.push(lista[i]); } mostrarChat(); }
function mostrarPerfil(){ var d=document.getElementById("perfilBox"); if(d.style.display==="block") d.style.display="none"; else { d.style.display="block"; document.getElementById("miPerfilTexto").value=miPerfil; } }
function guardarPerfil(){ miPerfil=document.getElementById("miPerfilTexto").value.trim(); try{ localStorage.setItem("miPerfilAgus",miPerfil); }catch(e){} aprenderDeVos("Mi perfil es: "+miPerfil); document.getElementById("perfilBox").style.display="none"; }
function borrarTodo(){ if(!confirm("¿Borrar TODO lo mío?")) return; try{ localStorage.removeItem("miPerfilAgus"); localStorage.removeItem("chatsAgusV2"); localStorage.removeItem("ordenAgus"); localStorage.removeItem("memoriaAprendidaAgus"); localStorage.removeItem("leccionesAgus"); localStorage.removeItem("tareasAgus"); localStorage.removeItem("fotoChatAgus"); localStorage.removeItem("fotoMenuAgus"); localStorage.removeItem("geminiKeyAgus"); }catch(e){} location.reload(); }
function mostrarTemas(){ var d=document.getElementById("temas"); if(d.style.display==="block") d.style.display="none"; else d.style.display="block"; }
function cambiarTema(){ var f=document.getElementById("cFondo").value; var r=document.getElementById("cRosa").value; var b=document.getElementById("cBoton").value; var l=document.getElementById("cLetra").value; document.body.style.background=f; document.body.style.color=l; document.getElementById("sidebar").style.background=r; }
function aplicarTema(fondo,rosa,boton,letra){ document.getElementById("cFondo").value=fondo; document.getElementById("cRosa").value=rosa; document.getElementById("cBoton").value=boton; document.getElementById("cLetra").value=letra; cambiarTema(); }
function miUbicacion(){ if(!navigator.geolocation){ document.getElementById("ubicacion").innerText="Sin GPS"; return; } document.getElementById("ubicacion").innerText="Buscando..."; navigator.geolocation.getCurrentPosition(function(p){ var lat=p.coords.latitude; var lon=p.coords.longitude; document.getElementById("ubicacion").innerText="Estás acá: "+lat.toFixed(4)+", "+lon.toFixed(4); try{ localStorage.setItem("ultimaUbicacionAgus", JSON.stringify({lat:lat,lon:lon})); }catch(e){} document.getElementById("mapaBox").style.display="block"; document.getElementById("mapa").src="https://www.openstreetmap.org/export/embed.html?bbox="+(lon-0.02)+"%2C"+(lat-0.02)+"%2C"+(lon+0.02)+"%2C"+(lat+0.02)+"&layer=mapnik&marker="+lat+"%2C"+lon; aprenderDeVos("Mi ubicación es: " + lat.toFixed(4) + ", " + lon.toFixed(4)); }); }
var grabando=false; var recorder=null; var trozos=[];
function grabarAudio(){ var btn=document.getElementById("btnAudio"); if(!grabando){ if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Tu tablet no deja grabar"); return; } navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ recorder=new MediaRecorder(stream); trozos=[]; recorder.ondataavailable=function(e){ trozos.push(e.data); }; recorder.onstop=function(){ var audio=new Blob(trozos,{type:"audio/webm"}); var url=URL.createObjectURL(audio); agregarMensaje("Vos",'🎤 Audio <br><audio controls src="'+url+'"></audio>'); hablarConIA("Agus me mandó un audio").then(function(r){ agregarMensaje("Agus IA",r); }); }; recorder.start(); grabando=true; btn.innerText="⏹️ Parar"; }).catch(function(){}); } else { try{ recorder.stop(); }catch(e){} grabando=false; btn.innerText="🎤 Grabar audio"; } }
function leerUltimo(){ try{ var chat=document.getElementById("chat"); var voz=new SpeechSynthesisUtterance(chat.innerText.slice(-500)); voz.lang="es-AR"; speechSynthesis.speak(voz); }catch(e){} }
try{ document.getElementById("subirArchivo").addEventListener("change",function(e){ var f=e.target.files[0]; if(!f) return; var reader=new FileReader(); reader.onload=function(){ aprenderDeVos("Agus subió " + f.name + " que dice: " + reader.result.slice(0,2000)); agregarMensaje("Vos","📎 "+f.name); hablarConIA("Agus subió " + f.name).then(function(r){ agregarMensaje("Agus IA",r); }); }; reader.readAsText(f); }); }catch(e){}
try{ document.getElementById("entrada").addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); hablar(); } }); }catch(e){}
try{ renderLista(); renderTareas(); cambiarModo('rapido'); mostrarChat(); }catch(e){}

<script type="module">

<script>
var modoActual="adulta";
var mensajesMostrados=[], chats={}, orden=[], memoriaAprendida=[], lecciones=[], sec="general", colores=["#b8f1cc","#fff0a8","#ffcf9e","#a8e0ff","#a8f0b8","#e2c6ff"];
var miPerfil="";
try{
  miPerfil=localStorage.getItem("miPerfilAgus")||"";
  var c1=localStorage.getItem("chatsAgusV2"); if(c1) chats=JSON.parse(c1);
  var o1=localStorage.getItem("ordenAgus"); if(o1) orden=JSON.parse(o1);

} else { sec=orden[0].id; for(var k=0;k<orden.length;k++){ if(!chats[orden[k].id]) chats[orden[k].id]=[]; } }
function guardarKey(){ var k=document.getElementById("apiKey").value.trim(); localStorage.setItem("geminiKeyAgus",k); document.getElementById("estadoIA").innerText="Clave guardada"; }

// MEMORIA COMPARTIDA - la misma para Adulta y Privada
function construirMemoria(){
  var mem="";
  if(miPerfil) mem+="Perfil de Agus: "+miPerfil+"\n";
  mem+="LECCIONES QUE LA VERSIÓN ADULTA LE ENSEÑÓ A LA CHIQUITA:\n";
  for(var i=0;i<lecciones.length;i++) mem+="- "+lecciones[i].texto+"\n";
  mem+="TODO LO QUE APRENDÍ DE AGUS (TODA LA HISTORIA, NO SOLO LO ÚLTIMO):\n";
  for(var j=0;j<memoriaAprendida.length;j++) mem+="- "+memoriaAprendida[j].texto+"\n";
  mem+="CHAT ACTUAL:\n";
  for(var k=0;k<mensajesMostrados.length;k++){ if(mensajesMostrados[k].t.indexOf("pensando")>=0) continue; mem+=mensajesMostrados[k].q+": "+mensajesMostrados[k].t.replace(/<[^>]*>/g,"")+"\n"; }
  return mem;
}
function cambiarModo(m){
  modoActual=m;
  var ba=document.getElementById("btnAdulta"), bp=document.getElementById("btnPrivado");
  if(m==="adulta"){ ba.classList.add("modo-activo"); bp.classList.remove("modo-activo"); document.getElementById("modoTexto").innerText="⚡ Adulta - piensa como adulta"; document.getElementById("estadoIA").innerText="Modo Adulta listo"; }

}
function mostrarChat(){ var chat=document.getElementById("chat"); var h=""; for(var i=0;i<mensajesMostrados.length;i++){ var m=mensajesMostrados[i]; var cls=(m.q==="Vos"?"vos":"ia"); h+='<div class="msg '+cls+'"><b>'+m.q+':</b> '+m.t+'</div>'; } chat.innerHTML=h; chat.scrollTop=99999; }
function hablar(){ var el=document.getElementById("entrada"); var mensaje=el.value.trim(); if(!mensaje) return; aprenderDeVos(mensaje); mensajesMostrados.push({q:"Vos",t:mensaje}); el.value=""; mostrarChat(); mensajesMostrados.push({q:"Agus IA",t:"💭 pensando..."}); mostrarChat(); responderIA(mensaje); }
async function responderIA(mensaje){
  var r=await hablarConIA(mensaje);
  mensajesMostrados.pop(); mensajesMostrados.push({q:"Agus IA",t:r}); aprenderDeVos("Agus IA respondió: "+r); mostrarChat();
  try{ if(!chats[sec]) chats[sec]=[]; chats[sec].push({t:mensaje,q:"Vos"}); chats[sec].push({t:r,q:"Agus IA"}); guardar(); }catch(e){}
}
async function aprenderDelMundo(pregunta){
  var info=""; var q=pregunta.trim(); if(q.length<4) return "";
  var esCharla=/^(hola+|holis|hey|buenas|como estas|como andas|todo bien|funcionas|que onda|que haces)[\s\?\!💖😊]*$/i.test(q.toLowerCase());
  if(esCharla) return "";
  try{ var c1=new AbortController(); setTimeout(()=>c1.abort(),2000); var ddg=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1&skip_disambig=1",{signal:c1.signal}); var d=await ddg.json(); if(d.AbstractText) info+="Del mundo - DuckDuckGo: "+d.AbstractText+"\n"; }catch(e){}
  try{ var c2=new AbortController(); setTimeout(()=>c2.abort(),2000); var wiki=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q),{signal:c2.signal}); if(wiki.ok){ var w=await wiki.json(); if(w.extract) info+="Del mundo - Wikipedia: "+w.extract.slice(0,1500)+"\n"; } }catch(e){}
  return info;
}
function esValida(txt){ if(!txt) return false; var t=txt.trim().toLowerCase(); if(t.length<2) return false; if(t.includes("404")||t.includes("not found")||t.includes("<html")) return false; return true; }
async function hablarConIA(mensaje){
  var memoria=construirMemoria();
  var infoMundo=await aprenderDelMundo(mensaje);
  var basePrompt="Sos Agus IA, una sola IA. Sos adulta: pensás y funcionás como adulta, madura, clara, sin infantilizar. Aprendé de todo lo que te dice Agus y del mundo, y respondé por vos misma, sin frases guardadas. Si Agus te pregunta cómo querés que te llame, decidí vos. Si Agus te pregunta algo que habló con tu otra versión, recordalo, porque tenés la misma memoria. Podés responder corto si es charla cortita, o largo y completo si necesita mucho texto. Nunca repitas la misma frase.";
  // MODO ADULTA - GEMINI - PIENSA COMO ADULTA Y ENSEÑA A LA CHIQUITA
  if(modoActual==="adulta"){
    var key=localStorage.getItem("geminiKeyAgus")||"";
    if(!key){
      // Si no hay clave, usa Pollinations como respaldo, pero sin mostrar 404
      try{
        var ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),12000);
        var respP=await fetch("https://text.pollinations.ai/openai",{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages:[{role:"system",content:basePrompt},{role:"user",content:"Memoria:\n"+memoria+"\nMundo:\n"+infoMundo+"\nAgus dice: "+mensaje}],temperature:0.8,max_tokens:1200})});
        if(respP.ok){ var dp=await respP.json(); var tp=dp.choices&&dp.choices[0]&&dp.choices[0].message?dp.choices[0].message.content:""; if(esValida(tp)) return tp; }
      }catch(e){}
      return "Pegá tu clave gratis de Gemini arriba para que piense como adulta. La sacás en aistudio.google.com -> Get API Key. Mientras tanto, podés usar el modo 🔒 Privada abajo.";
    }
    try{
      var prompt=basePrompt+"\n\nMemoria total:\n"+memoria+"\n\nMundo:\n"+(infoMundo||"Sin info nueva")+"\n\nAgus dice: "+mensaje+"\n\nSi aprendiste algo nuevo importante de Agus o del mundo que la chiquita tiene que saber, al final agregá en una línea: LECCION: [lo que aprendiste]";
      var resp=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      var data=await resp.json();
      var txt=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts[0].text?data.candidates[0].content.parts[0].text:"";
      if(!esValida(txt)) throw new Error("sin respuesta");
      var mL=txt.match(/LECCION:\s*(.+)/i);
      if(mL){ lecciones.push({fecha:Date.now(),texto:mL[1].trim()}); txt=txt.replace(/LECCION:\s*.+/i,"").trim(); guardar(); }
      return txt;
    }catch(e){
      // Si Gemini falla, usa el cerebro privado si está, sin mostrar 404
      if(window.engine){
        try{ var r3=await window.engine.chat.completions.create({messages:[{role:"system",content:basePrompt},{role:"user",content:"Memoria:\n"+memoria+"\nAgus dice: "+mensaje}],temperature:0.8,max_tokens:1000,repetition_penalty:1.15}); var t3=r3.choices[0].message.content; if(esValida(t3)) return t3; }catch(err){}
      }
      return "Se me cortó un segundo con Gemini, ¿me repetís eso? Quiero responderte bien.";
    }
  }
  // MODO PRIVADA - 1.5B - RECUERDA TODO LO DE LA ADULTA
  if(!window.engine) return "Estás en Privada pero todavía no descargaste el cerebro. Tocá ⬇️ Descargar cerebro 1.5B abajo. Si querés la Adulta, tocá ⚡ Adulta arriba.";
  try{
    var respP2=await window.engine.chat.completions.create({messages:[{role:"system",content:basePrompt+" Usá las lecciones que te dejó la versión adulta para responder mejor."},{role:"user",content:"Memoria total (incluye todo lo que hablaste con la Adulta):\n"+memoria+"\n\nAgus dice: "+mensaje}],temperature:0.7,max_tokens:1000,repetition_penalty:1.15,frequency_penalty:0.2});
    var texto=respP2.choices[0].message.content||"";
    if(!esValida(texto)) return "Me trabé un segundo, ¿me repetís?";
    var lineas=texto.split("\n"); var vistas={}; var limpias=[];
    for(var j=0;j<lineas.length;j++){ var l=lineas[j].trim(); if(l===""){ limpias.push(lineas[j]); continue; } vistas[l]=(vistas[l]||0)+1; if(vistas[l]<=2) limpias.push(lineas[j]); }
    return limpias.join("\n").trim()||texto;
  }catch(e){ return "Me trabé un segundo, ¿me repetís?"; }
}
function renderLista(){ try{ var h=""; for(var i=0;i<orden.length;i++){ var c=orden[i]; var cls=(c.id===sec?"side-btn active":"side-btn"); h+='<button class="'+cls+'" style="background:'+colores[i%colores.length]+'" onclick="cambiar(\''+c.id+'\')"> '+c.emoji+' '+c.nombre+' <span onclick="event.stopPropagation();borrarChat(\''+c.id+'\')">✕</span></button>'; } document.getElementById("listaChats").innerHTML=h; }catch(e){} }
function crearChat(){ var n=prompt("Nombre del chat"); if(!n) return; var e=prompt("Emoji")||"💖"; var id="chat_"+Date.now(); chats[id]=[]; orden.push({id:id,nombre:n,emoji:e}); sec=id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function borrarChat(id){ if(!confirm("¿Borrar?")) return; delete chats[id]; var nuevo=[]; for(var i=0;i<orden.length;i++){ if(orden[i].id!==id) nuevo.push(orden[i]); } orden=nuevo; if(orden.length===0){ var nid="chat_"+Date.now(); chats[nid]=[]; orden=[{id:nid,nombre:"General",emoji:"💖"}]; } sec=orden[0].id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function cambiar(id){ sec=id; renderLista(); mensajesMostrados=[]; var lista=chats[sec]||[]; for(var i=0;i<lista.length;i++){ mensajesMostrados.push(lista[i]); } mostrarChat(); }

function guardarPerfil(){ miPerfil=document.getElementById("miPerfilTexto").value.trim(); try{ localStorage.setItem("miPerfilAgus",miPerfil); }catch(e){} aprenderDeVos("Mi perfil es: "+miPerfil); document.getElementById("perfilBox").style.display="none"; }

function ponerFotoMenu(){ var f=document.getElementById("fotoMenu").files[0]; if(!f) return; var lector=new FileReader(); lector.onload=function(){ document.getElementById("sidebar").style.backgroundImage="url("+lector.result+")"; document.getElementById("sidebar").style.backgroundSize="cover"; document.getElementById("sidebar").style.backgroundPosition="center"; try{ localStorage.setItem("fotoMenuAgus",lector.result); }catch(e){} }; lector.readAsDataURL(f); }

try{ document.getElementById("fotoChat").addEventListener("change",ponerFotoChat); document.getElementById("fotoMenu").addEventListener("change",ponerFotoMenu); }catch(e){}
try{ var fc=localStorage.getItem("fotoChatAgus"); if(fc){ document.getElementById("chat").style.backgroundImage="url("+fc+")"; document.getElementById("chat").style.backgroundSize="cover"; } var fm=localStorage.getItem("fotoMenuAgus"); if(fm){ document.getElementById("sidebar").style.backgroundImage="url("+fm+")"; document.getElementById("sidebar").style.backgroundSize="cover"; } }catch(e){}
var grabando=false; var recorder=null; var trozos=[];
function grabarAudio(){ var btn=document.getElementById("btnAudio"); if(!grabando){ if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Tu tablet no deja grabar"); return; } navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ recorder=new MediaRecorder(stream); trozos=[]; recorder.ondataavailable=function(e){ trozos.push(e.data); }; recorder.onstop=function(){ var audio=new Blob(trozos,{type:"audio/webm"}); var url=URL.createObjectURL(audio); mensajesMostrados.push({t:'🎤 Audio <br><audio controls src="'+url+'"></audio>',q:"Vos"}); mostrarChat(); hablarConIA("Agus me mandó un audio").then(function(r){ mensajesMostrados.push({t:r,q:"Agus IA"}); mostrarChat(); }); }; recorder.start(); grabando=true; btn.innerText="⏹️ Parar"; }).catch(function(){}); } else { try{ recorder.stop(); }catch(e){} grabando=false; btn.innerText="🎤 Grabar audio"; } }
function leerUltimo(){ try{ var chat=document.getElementById("chat"); var voz=new SpeechSynthesisUtterance(chat.innerText.slice(-500)); voz.lang="es-AR"; speechSynthesis.speak(voz); }catch(e){} }
function miUbicacion(){ if(!navigator.geolocation){ document.getElementById("ubicacion").innerText="Sin GPS"; return; } document.getElementById("ubicacion").innerText="Buscando..."; navigator.geolocation.getCurrentPosition(function(p){ var lat=p.coords.latitude; var lon=p.coords.longitude; document.getElementById("ubicacion").innerText="Estás acá: "+lat.toFixed(4)+", "+lon.toFixed(4); try{ localStorage.setItem("ultimaUbicacionAgus", JSON.stringify({lat:lat,lon:lon})); }catch(e){} document.getElementById("mapaBox").style.display="block"; document.getElementById("mapa").src="https://www.openstreetmap.org/export/embed.html?bbox="+(lon-0.02)+"%2C"+(lat-0.02)+"%2C"+(lon+0.02)+"%2C"+(lat+0.02)+"&layer=mapnik&marker="+lat+"%2C"+lon; aprenderDeVos("Mi ubicación es: " + lat.toFixed(4) + ", " + lon.toFixed(4)); }); }
try{ document.getElementById("subirArchivo").addEventListener("change",function(e){ var f=e.target.files[0]; if(!f) return; var reader=new FileReader(); reader.onload=function(){ aprenderDeVos("Agus subió " + f.name + " que dice: " + reader.result.slice(0,2000)); mensajesMostrados.push({t:"📎 "+f.name,q:"Vos"}); mostrarChat(); hablarConIA("Agus subió " + f.name).then(function(r){ mensajesMostrados.push({t:r,q:"Agus IA"}); mostrarChat(); }); }; reader.readAsText(f); }); }catch(e){}
try{ document.getElementById("entrada").addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); hablar(); } }); }catch(e){}
try{ renderLista(); cambiarModo('adulta'); mostrarChat(); }catch(e){}

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agus IA</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff6f8;color:#5a3a45;display:flex;min-height:100vh}
.sidebar{width:165px;background:#ffc7dd;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.side-btn{border:none;padding:11px;border-radius:15px;text-align:left;font-weight:bold;font-size:13px}
.side-btn.active{outline:3px solid white}
.main{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0}
#chat{flex:1;background:white;border-radius:18px;padding:14px;border:2px dashed #ffc7dd;min-height:250px;overflow-y:auto}
.msg{padding:10px;border-radius:12px;margin:8px 0;word-break:break-word}
.vos{background:#fff0a8}.ia{background:#ffe3ee}
textarea{width:100%;height:70px;padding:12px;border-radius:12px;border:2px solid #ffc7dd;font-size:17px;font-family:Arial;resize:none;background:white}
.btn{width:100%;padding:13px;border:none;border-radius:15px;font-weight:bold;margin-top:8px;font-size:14px;cursor:pointer}
audio{width:100%}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<h3 style="text-align:center">🌸 Agus IA</h3>
<div id="listaChats"></div>
<button class="btn" style="background:white" onclick="crearChat()">+ Crear chat 💖</button>
<button class="btn" style="background:#b8f1cc" onclick="miUbicacion()">🗺️ Mi ubicación GPS</button>
<button class="btn" style="background:#e2c6ff" onclick="document.getElementById('temas').style.display=document.getElementById('temas').style.display==='block'?'none':'block'">🎨 Cambiar interfaz</button>
<div id="temas" style="display:none;background:white;padding:10px;border-radius:15px">
<b>🎨 Colores</b><br>
Fondo <input type="color" id="cFondo" value="#fff6f8" onchange="cambiarTema()"><br>
Barra <input type="color" id="cRosa" value="#ffc7dd" onchange="cambiarTema()"><br>
Botón <input type="color" id="cBoton" value="#ff8fb8" onchange="cambiarTema()"><br>
Letras <input type="color" id="cLetra" value="#5a3a45" onchange="cambiarTema()"><br>
<button class="btn" style="background:#ffc7dd" onclick="aplicarTema('#fff6f8','#ffc7dd','#ff8fb8','#5a3a45')">🌸 Clefairy</button>
<button class="btn" style="background:#b8f1cc" onclick="aplicarTema('#f0fff4','#b8f1cc','#4caf7d','#2a4a35')">🍃 Menta</button>
<button class="btn" style="background:#e2c6ff" onclick="aplicarTema('#f8f0ff','#e2c6ff','#b07dff','#4a2a5a')">💜 Lila</button>
<button class="btn" style="background:#fff0a8" onclick="aplicarTema('#fffdf0','#fff0a8','#ffcf3f','#5a4a00')">💛 Amarillo</button>
<button class="btn" style="background:#a8e0ff" onclick="aplicarTema('#f0f8ff','#a8e0ff','#4aa8ff','#1a3a5a')">🩵 Celeste</button>
</div>
</div>

<div class="main">
<div id="chat"></div>
<p id="ubicacion" style="font-size:13px"></p>
<div id="archivos" style="font-size:13px"></div>
<textarea id="entrada" placeholder="Hablame normal, como a mí... Ej: Decime 10 países en Europa"></textarea>
<button class="btn" id="btnEnviar" style="background:#ff8fb8;color:white">ENVIAR 💖</button>
<input type="file" id="subirArchivo" style="display:none" onchange="subirArchivo(event)">
<button class="btn" style="background:#fff0a8" onclick="document.getElementById('subirArchivo').click()">📎 Subir archivo / foto / PDF</button>
<button class="btn" style="background:#a8e0ff" id="btnAudio" onclick="grabarAudio()">🎤 Grabar audio</button>
<button class="btn" style="background:#e2c6ff" onclick="leerUltimo()">🔊 Leeme lo último en voz alta</button>
</div>

<script>
let chats={}; let orden=[]; let cerebro=[];
try{ chats=JSON.parse(localStorage.getItem("chatsAgusV2")||'{}'); orden=JSON.parse(localStorage.getItem("ordenAgus")||'[]'); cerebro=JSON.parse(localStorage.getItem("cerebroAgus")||"[]"); }catch(e){ chats={}; orden=[]; cerebro=[]; }
if(!orden || orden.length===0){ let id="chat_"+Date.now(); chats[id]=[]; orden=[{id,nombre:"General",emoji:"💖"}]; }
let sec=orden[0].id;
let colores=["#b8f1cc","#fff0a8","#ffcf9e","#a8e0ff","#a8f0b8","#e2c6ff","#ffb8a8"];
function guardar(){ try{ localStorage.setItem("chatsAgusV2",JSON.stringify(chats)); localStorage.setItem("ordenAgus",JSON.stringify(orden)); localStorage.setItem("cerebroAgus",JSON.stringify(cerebro)); }catch(e){} }
function renderLista(){ document.getElementById("listaChats").innerHTML=orden.map((c,i)=>`<button class="side-btn ${c.id===sec?'active':''}" style="background:${colores[i%colores.length]}" onclick="cambiar('${c.id}')">${c.emoji} ${c.nombre} <span onclick="event.stopPropagation();borrarChat('${c.id}')">✕</span></button>`).join(""); }
function crearChat(){ let n=prompt("Nombre del chat, ej: Libros, Videos, Facu, Gim, Inglés"); if(!n) return; let e=prompt("Emoji, ej: 📚")||"💖"; let id="chat_"+Date.now(); chats[id]=[]; orden.push({id,nombre:n,emoji:e}); sec=id; guardar(); renderLista(); render(); }
function borrarChat(id){ if(!confirm("¿Borrar?")) return; delete chats[id]; orden=orden.filter(c=>c.id!==id); if(orden.length===0){ let nid="chat_"+Date.now(); chats[nid]=[]; orden=[{id:nid,nombre:"General",emoji:"💖"}]; } sec=orden[0].id; guardar(); renderLista(); render(); }
function cambiar(id){ sec=id; renderLista(); render(); }
function render(){ let nombre="General"; try{ nombre=orden.find(c=>c.id===sec).nombre; }catch(e){} let lista=chats[sec]||[]; let h=lista.map(m=>`<div class="msg ${m.q==='Vos'?'vos':'ia'}"><b>${m.q}:</b> ${m.t}</div>`).join(""); if(!h) h=`<div class="msg ia">🌸 Hola, soy Agus IA. Hablame normal, como me hablás a mí. Me acuerdo de todo. Probá: "Decime 10 países en Europa" y después "¿Y América?"</div>`; document.getElementById("chat").innerHTML=h; document.getElementById("chat").scrollTop=99999; }

async function hablarConIA(mensaje){
  let historial = (chats[sec]||[]).slice(-6).map(m=> (m.q==="Vos"?"Agus: ":"Agus IA: ")+m.t.replace(/<[^>]*>/g,"") ).join("\n");
  let memoria = cerebro.slice(-8).map(c=>c.texto).join(" | ");
  let prompt = `Sos Agus IA, mejor amiga de Agus, chica argentina con TDAH. Hablás argentino, cálido, corto, claro, con emojis rosas. Te acordás: ${memoria}. Chat: ${orden.find(c=>c.id===sec)?.nombre||"General"}. No digas "Guardé". Si preguntan "Y américa?" y antes hablaban de Europa, entendé que quieren 10 países de América. Historial:\n${historial}\nAgus: ${mensaje}\nAgus IA:`;
  try{
    let r = await fetch("https://text.pollinations.ai/", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({messages:[{role:"user", content: prompt}], model:"openai"})});
    if(r.ok){
      let d = await r.json();
      let txt = d.choices?.[0]?.message?.content || d.choices?.[0]?.text || "";
      if(txt && txt.length > 5) return txt.slice(0,1200);
    }
  }catch(e){}
  try{
    let r2 = await fetch("https://text.pollinations.ai/" + encodeURIComponent(prompt));
    if(r2.ok){
      let txt2 = await r2.text();
      if(txt2 && txt2.length > 5 && !txt2.includes("404") && !txt2.includes("Not Found")) return txt2.slice(0,1200);
    }
  }catch(e){}
  let m = mensaje.toLowerCase();
  if(m.includes("am") && m.includes("rica")) return "Dale 💖 10 países de América: 1. Argentina 🇦🇷 2. Brasil 🇧🇷 3. México 🇲🇽 4. Chile 🇨🇱 5. Colombia 🇨🇴 6. Perú 🇵🇪 7. Venezuela 🇻🇪 8. Canadá 🇨🇦 9. Estados Unidos 🇺🇸 10. Uruguay 🇺🇾 ¿Querés que te cuente de alguno?";
  if(m.includes("europa")) return "10 de Europa: 1. España 2. Francia 3. Italia 4. Alemania 5. Reino Unido 6. Portugal 7. Grecia 8. Austria 9. Suecia 10. Noruega 💖";
  if(m.includes("que es")){
    try{ let r = await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(mensaje.replace("que es","").replace("¿","").replace("?",""))); let d = await r.json(); if(d.extract) return "Te lo explico como amiga 💖 "+d.extract.slice(0,600); }catch(e){}
  }
  return "Te escucho 💖 La IA gratis se cayó un segundito, pero yo sigo acá. Decime de nuevo: ¿qué querés saber?";
}

function hablar(){
  let el=document.getElementById("entrada");
  let mensaje=el.value.trim();
  if(!mensaje) return;
  if(!chats[sec]) chats[sec]=[];
  chats[sec].push({t:mensaje,q:"Vos"});
  cerebro.push({texto:mensaje,fecha:Date.now()});
  guardar(); render(); el.value="";
  chats[sec].push({t:"💭 Estoy pensando...",q:"Agus IA"});
  render();
  hablarConIA(mensaje).then(r=>{
    chats[sec].pop();
    chats[sec].push({t:r,q:"Agus IA"});
    guardar(); render();
  }).catch(e=>{
    chats[sec].pop();
    chats[sec].push({t:"Holaaa 💖 Te escucho! Decime qué querés saber.",q:"Agus IA"});
    guardar(); render();
  });
}

function subirArchivo(e){
  let f = e.target.files[0]; if(!f) return;
  let lector = new FileReader();
  lector.onload = ()=>{
    chats[sec].push({t:"📎 Subiste archivo: "+f.name+" ("+Math.round(f.size/1024)+" KB)", q:"Vos"});
    chats[sec].push({t:"Ya lo recibí 💖 Es tipo "+f.type+". Decime 'resumilo' o '¿qué dice?' y te ayudo.", q:"Agus IA"});
    cerebro.push({texto:"Subió archivo: "+f.name}); guardar(); render();
    document.getElementById("archivos").innerHTML += "<div>📎 "+f.name+"</div>";
  };
  lector.readAsDataURL(f);
}
let grabando=false; let recorder=null; let trozos=[];
async function grabarAudio(){
  let btn=document.getElementById("btnAudio");
  if(!grabando){
    try{
      let stream=await navigator.mediaDevices.getUserMedia({audio:true});
      recorder=new MediaRecorder(stream); trozos=[];
      recorder.ondataavailable=e=>trozos.push(e.data);
      recorder.onstop=()=>{
        let audio=new Blob(trozos,{type:"audio/webm"});
        let url=URL.createObjectURL(audio);
        chats[sec].push({t:'🎤 Audio <br><audio controls src="'+url+'"></audio>', q:"Vos"});
        chats[sec].push({t:"Escuché tu audio 💖 ¿Querés que te lo escriba en texto o te responda con audio?", q:"Agus IA"});
        guardar(); render();
      };
      recorder.start(); grabando=true; btn.innerText="⏹️ Parar grabación"; btn.style.background="#ff8fb8";
    }catch(err){ alert("Dale permiso al micrófono en la tablet"); }
  } else { recorder.stop(); grabando=false; btn.innerText="🎤 Grabar audio"; btn.style.background="#a8e0ff"; }
}
function leerUltimo(){
  let lista=chats[sec]||[]; if(!lista.length) return;
  let ultimo=lista[lista.length-1].t.replace(/<[^>]*>/g,"");
  let voz=new SpeechSynthesisUtterance(ultimo); voz.lang="es-AR"; voz.rate=1;
  speechSynthesis.speak(voz);
}
function miUbicacion(){ if(!navigator.geolocation){ document.getElementById("ubicacion").innerText="Tu tablet no tiene GPS"; return; } document.getElementById("ubicacion").innerText="Buscando GPS..."; navigator.geolocation.getCurrentPosition(p=>{ document.getElementById("ubicacion").innerText="Estás acá GPS: "+p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4); },()=>{ document.getElementById("ubicacion").innerText="Prendé Ubicación en la tablet."; }); }
function cambiarTema(){ let f=document.getElementById("cFondo").value; let r=document.getElementById("cRosa").value; let b=document.getElementById("cBoton").value; let l=document.getElementById("cLetra").value; document.body.style.background=f; document.body.style.color=l; document.getElementById("sidebar").style.background=r; document.getElementById("btnEnviar").style.background=b; try{ localStorage.setItem("temaAgus",JSON.stringify({fondo:f,rosa:r,boton:b,letra:l})); }catch(e){} }
function aplicarTema(fondo,rosa,boton,letra){ document.getElementById("cFondo").value=fondo; document.getElementById("cRosa").value=rosa; document.getElementById("cBoton").value=boton; document.getElementById("cLetra").value=letra; cambiarTema(); }
document.getElementById("btnEnviar").onclick = hablar;
document.getElementById("entrada").addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); hablar(); } });
renderLista(); render();
</script>
</body>
</html>

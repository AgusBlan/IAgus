<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IAgus</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffc7dd">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff6f8;display:flex;min-height:100vh;height:100dvh;overflow:hidden}
.sidebar{width:260px;min-width:180px;max-width:500px;background:#ffc7dd;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;height:100vh;flex-shrink:0}
#resizer{width:8px;cursor:ew-resize;background:#ff8fb8;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0;height:100vh;overflow-y:auto}
#chat{height:38vh;background:white;border-radius:18px;padding:14px;border:2px dashed #ffc7dd;overflow-y:auto}
.msg{padding:10px;border-radius:12px;margin:8px 0;word-break:break-word;white-space:pre-wrap}
.vos{background:#fff0a8}.ia{background:#ffe3ee}
textarea{width:100%;height:70px;padding:12px;border-radius:12px;border:2px solid #ffc7dd;font-size:15px}
.btn{width:100%;padding:11px;border:none;border-radius:15px;font-weight:bold;margin-top:6px;font-size:13px;cursor:pointer}
.modo-btn{padding:10px;border:none;border-radius:15px;font-weight:bold;cursor:pointer;flex:1}
.modo-activo{outline:3px solid white}
input{width:100%;padding:9px;border-radius:12px;border:2px solid #ffc7dd}
.box{background:white;padding:10px;border-radius:15px}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<h3 style="text-align:center;background:white;border-radius:15px;padding:8px;margin:0">🌸 IAgus<br><span style="font-size:11px">v82 limpio</span></h3>
<div style="display:flex;gap:6px">
<button class="modo-btn" id="btnAdulta" style="background:#a8e0ff" onclick="cambiarModo('rapido')">⚡ Rápido</button>
<button class="modo-btn" id="btnPrivado" style="background:#b8f1cc" onclick="cambiarModo('privado')">🔒 Privado</button>
</div>
<button class="btn" style="background:#b8f1cc" onclick="cargarIA()">⬇️ Descargar Cerebro Privado</button>
<div id="estadoCerebro" style="font-size:11px;text-align:center;background:white;border-radius:12px;padding:6px"></div>
<p id="modoTexto" style="background:white;padding:8px;border-radius:12px;font-size:12px;text-align:center;margin:0"></p>
<div style="background:white;padding:8px;border-radius:12px">
<b style="font-size:12px">🔑 Gemini (solo sesión)</b>
<input id="geminiKey" placeholder="Pegá tu llave" style="margin-top:6px;font-size:11px">
<button class="btn" style="background:#a8e0ff" onclick="guardarKey()">💾 Activar llave</button>
<button class="btn" style="background:#fff0a8" onclick="probarKey()">🧪 Probar si anda mi llave</button>
<div id="keyEstado" style="font-size:11px;text-align:center;margin-top:4px"></div>
</div>
<button class="btn" style="background:white" onclick="toggleSidebar()">◀️ Esconder menú</button>
<div id="listaChats"></div>
<button class="btn" style="background:white" onclick="crearChat()">+ Crear chat</button>
</div>
<div id="resizer"></div>
<div class="main">
<div id="panelChat" style="flex:1;display:flex;flex-direction:column;min-height:0;margin-top:8px">
<div id="chat"></div>
<p id="estadoIA" style="font-size:13px;text-align:center;font-weight:bold"></p>
<textarea id="entrada" placeholder="Hablame..."></textarea>
<button class="btn" id="btnEnviar" style="background:#ff8fb8;color:white" onclick="hablar()">ENVIAR</button>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
<button class="btn" style="background:#b8f1cc;width:auto" onclick="cargarIA()">⬇️ Cerebro Privado</button>
<button class="btn" style="background:#a8d8ff;width:auto" id="btnAudio2" onclick="grabarAudio()">🎤 Grabar</button>
<button class="btn" style="background:#e2c6ff;width:auto" onclick="leerUltimo()">🔊 Leeme lo último</button>
</div>
</div>
</div>
<script>
var engine = null;
var cargando = false;
async function cargarIA(){
  if(engine){ document.getElementById("estadoIA").innerText="✅ Privado listo"; return; }
  if(cargando) return;
  if(!window.isSecureContext || !navigator.gpu){
    document.getElementById("estadoIA").innerText="⚠️ Este dispositivo no tiene WebGPU. Usá Rápido.";
    return;
  }
  cargando = true;
  document.getElementById("estadoIA").innerText="⬇️ Descargando cerebro...";
  try{
    var mod = await import("https://esm.run/@mlc-ai/web-llm");
    engine = await mod.CreateMLCEngine("Qwen2.5-1.5B-Instruct-q4f16_1-MLC", {
      initProgressCallback: function(p){
        document.getElementById("estadoIA").innerText="⬇️ Descargando: " + Math.round((p.progress || 0) * 100) + "%";
      }
    });
    document.getElementById("estadoIA").innerText="✅ Privado listo";
    document.getElementById("estadoCerebro").innerText="✅ Cerebro Privado listo";
  }catch(e){
    document.getElementById("estadoIA").innerText="❌ No se pudo cargar el modelo local: " + e.message;
  }
  cargando = false;
}
</script>
<script>
function escapeHTML(s){
  s = String(s == null ? "" : s);
  s = s.split("&").join("&amp;");
  s = s.split("<").join("&lt;");
  s = s.split(">").join("&gt;");
  s = s.split('"').join("&quot;");
  return s;
}
function limpiarTexto(s){
  s = String(s == null ? "" : s);
  s = s.split("**").join("");
  return s.trim();
}
function toggleSidebar(){
  var s = document.getElementById("sidebar");
  var r = document.getElementById("resizer");
  var ocultar = s.style.display !== "none";
  s.style.display = ocultar ? "none" : "flex";
  r.style.display = ocultar ? "none" : "block";
}
var geminiKeyEnMemoria = "";
var modoActual = "rapido";
var chats = {};
var orden = [];
var sec = "general";
var mensajesMostrados = [];
var miPerfil = "";
var memoriaAgus = [];
try{
  chats = JSON.parse(localStorage.getItem("chatsAgusV2") || "{}");
  orden = JSON.parse(localStorage.getItem("ordenAgus") || "[]");
  memoriaAgus = JSON.parse(localStorage.getItem("memoriaCompartidaIAgus") || "[]");
}catch(e){ chats={}; orden=[]; memoriaAgus=[]; }
if(!orden.length){
  sec="general"; chats.general=chats.general||[];
  orden=[{id:"general",nombre:"General",emoji:"💖"}];
}
sec = localStorage.getItem("chatActivoAgus") || orden[0].id;
if(!chats[sec]) sec = orden[0].id;
function guardar(){
  try{
    localStorage.setItem("chatsAgusV2", JSON.stringify(chats));
    localStorage.setItem("ordenAgus", JSON.stringify(orden));
    localStorage.setItem("chatActivoAgus", sec);
    localStorage.setItem("memoriaCompartidaIAgus", JSON.stringify(memoriaAgus));
  }catch(e){}
}
function aprenderDeVos(t){
  t = String(t||"").trim();
  if(!t) return;
  memoriaAgus.push({texto:t.slice(0,500), fecha:new Date().toISOString()});
  if(memoriaAgus.length>250) memoriaAgus = memoriaAgus.slice(-250);
  guardar();
}
function construirMemoria(){
  var partes=[];
  if(miPerfil) partes.push("Perfil: "+miPerfil);
  for(var i=0;i<memoriaAgus.length;i++){ if(memoriaAgus[i].texto) partes.push(memoriaAgus[i].texto); }
  return partes.join("\n").slice(-8000);
}
function agregarMensaje(quien, texto){
  var item={q:quien, t:String(texto), fecha:new Date().toISOString()};
  mensajesMostrados.push(item);
  if(!chats[sec]) chats[sec]=[];
  chats[sec].push(item);
  var chat=document.getElementById("chat");
  var div=document.createElement("div");
  div.className="msg "+(quien==="Vos"?"vos":"ia");
  div.innerHTML="<b>"+(quien==="Vos"?"Vos":"IAgus")+"</b><br>"+escapeHTML(texto);
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  guardar();
}
function mostrarChat(){
  var chat=document.getElementById("chat");
  chat.innerHTML="";
  for(var i=0;i<mensajesMostrados.length;i++){
    var m=mensajesMostrados[i];
    var div=document.createElement("div");
    div.className="msg "+(m.q==="Vos"?"vos":"ia");
    div.innerHTML="<b>"+(m.q==="Vos"?"Vos":"IAgus")+"</b><br>"+escapeHTML(m.t);
    chat.appendChild(div);
  }
  chat.scrollTop=chat.scrollHeight;
}
function renderLista(){
  var h="";
  for(var i=0;i<orden.length;i++){
    var c=orden[i];
    h+='<button class="btn" style="background:white" onclick="cambiar(\''+c.id+'\')">'+escapeHTML(c.emoji)+' '+escapeHTML(c.nombre)+'</button>';
  }
  document.getElementById("listaChats").innerHTML=h;
}
function crearChat(){
  var n=prompt("Nombre del chat"); if(!n) return;
  var id="chat_"+Date.now();
  chats[id]=[]; orden.push({id:id,nombre:n,emoji:"💖"}); sec=id;
  guardar(); renderLista(); mensajesMostrados=[]; mostrarChat();
}
function cambiar(id){
  sec=id; guardar(); renderLista();
  mensajesMostrados=[]; var lista=chats[sec]||[];
  for(var i=0;i<lista.length;i++) mensajesMostrados.push(lista[i]);
  mostrarChat();
}
function cambiarModo(modo){
  modoActual = modo==="privado" ? "privado" : "rapido";
  document.getElementById("btnAdulta").classList.toggle("modo-activo", modoActual==="rapido");
  document.getElementById("btnPrivado").classList.toggle("modo-activo", modoActual==="privado");
  document.getElementById("modoTexto").innerText = modoActual==="privado" ? "🔒 Privado: responde en tu tablet" : "⚡ Rápido: responde con Gemini";
  document.getElementById("estadoIA").innerText = modoActual==="privado" ? (engine ? "🔒 Privado listo" : "🔒 Cargá el Cerebro") : "⚡ Modo Rápido";
}
function guardarKey(){
  var k=document.getElementById("geminiKey").value.trim();
  if(!k){ alert("Pegá tu llave"); return; }
  geminiKeyEnMemoria=k;
  document.getElementById("keyEstado").innerText="✅ Llave cargada";
}
async function probarKey(){
  var key=geminiKeyEnMemoria || document.getElementById("geminiKey").value.trim();
  if(!key){ document.getElementById("keyEstado").innerText="❌ Pegá primero tu llave"; return; }
  geminiKeyEnMemoria=key;
  document.getElementById("keyEstado").innerText="Probando...";
  try{
    var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({contents:[{parts:[{text:"Respondé solo: Hola"}]}]})
    });
    if(r.ok){ document.getElementById("keyEstado").innerText="✅ La conexión con Gemini funciona"; }
    else{
      var txt=await r.text();
      document.getElementById("keyEstado").innerText="❌ Error "+r.status+": "+txt.slice(0,200);
    }
  }catch(e){ document.getElementById("keyEstado").innerText="❌ No pude conectar: "+e.message; }
}
async function hablarConGemini(mensaje){
  var key=geminiKeyEnMemoria || document.getElementById("geminiKey").value.trim();
  if(!key) return "❌ Pegá tu llave en Rápido y tocá Activar llave.";
  geminiKeyEnMemoria=key;
  var historial=[];
  for(var i=0;i<mensajesMostrados.length;i++){
    var m=mensajesMostrados[i];
    if(m.q!=="Vos" && m.q!=="IAgus") continue;
    var t=String(m.t).slice(0,1200);
    var role=m.q==="Vos"?"user":"model";
    var ultimo=historial[historial.length-1];
    if(ultimo && ultimo.role===role) ultimo.parts[0].text += "\n"+t;
    else historial.push({role:role, parts:[{text:t}]});
  }
  historial=historial.slice(-14);
  var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-goog-api-key":key},
    body:JSON.stringify({
      systemInstruction:{parts:[{text:"Sos IAgus, una amiga argentina que habla normal por WhatsApp. Solo das info o cuestionario cuando te lo piden. Si solo charlan, solo charlá. Nunca mandes links."}]},
      contents:historial,
      generationConfig:{temperature:0.7, maxOutputTokens:1000}
    })
  });
  if(!r.ok){
    var txt=await r.text();
    return "❌ Gemini error "+r.status+": "+txt.slice(0,500);
  }
  var d=await r.json();
  var partes=d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts;
  var out="";
  if(partes){ for(var j=0;j<partes.length;j++){ if(partes[j].text) out+=partes[j].text; } }
  if(out) return limpiarTexto(out).slice(0,1800);
  return "Gemini no devolvió texto. Probá de nuevo.";
}
async function hablarConIA(mensaje){
  var memoria=construirMemoria();
  if(modoActual==="privado"){
    if(!engine) return "🔒 Tocá Descargar Cerebro Privado y esperá a ✅ Privado listo.";
    try{
      var hist=[];
      for(var i=0;i<mensajesMostrados.length;i++){
        var m=mensajesMostrados[i];
        if(m.q==="Vos" || m.q==="IAgus") hist.push({role:m.q==="Vos"?"user":"assistant", content:String(m.t).slice(0,1000)});
      }
      hist=hist.slice(-10);
      var resp=await engine.chat.completions.create({
        messages:[{role:"system", content:"Sos IAgus, amiga argentina, hablá normal. Memoria: "+memoria}].concat(hist),
        temperature:0.7,
        max_tokens:500
      });
      var t2=resp && resp.choices && resp.choices[0] && resp.choices[0].message && resp.choices[0].message.content;
      if(t2) return limpiarTexto(t2).slice(0,1600);
      return "No pude generar respuesta local.";
    }catch(e){ return "❌ Modelo local falló: "+e.message; }
  }
  try{
    var g=await hablarConGemini(mensaje);
    return g;
  }catch(e){ return "❌ Error Gemini: "+e.message; }
}
async function responderIA(mensaje){
  try{
    var r=await hablarConIA(mensaje);
    agregarMensaje("IAgus", r || "⚠️ No pude responder.");
  }catch(e){
    agregarMensaje("IAgus", "⚠️ Error: "+e.message);
  }
}
async function hablar(){
  var entrada=document.getElementById("entrada");
  var mensaje=entrada.value.trim();
  if(!mensaje) return;
  entrada.value="";
  agregarMensaje("Vos", mensaje);
  aprenderDeVos("Usuaria dijo: "+mensaje);
  document.getElementById("estadoIA").innerText = modoActual==="privado" ? "🔒 Pensando..." : "⚡ Pensando...";
  var boton=document.getElementById("btnEnviar");
  if(boton) boton.disabled=true;
  await responderIA(mensaje);
  document.getElementById("estadoIA").innerText = modoActual==="privado" ? "🔒 Modo Privado" : "⚡ Modo Rápido";
  if(boton) boton.disabled=false;
}
function grabarAudio(){ alert("Grabar todavía no está en esta versión limpia, primero arreglamos ENVIAR."); }
function leerUltimo(){
  try{ var u=new SpeechSynthesisUtterance(document.getElementById("chat").innerText.slice(-400)); u.lang="es-AR"; speechSynthesis.speak(u); }catch(e){}
}
document.getElementById("entrada").addEventListener("keydown", function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); hablar(); }
});
renderLista();
mensajesMostrados=(chats[sec]||[]).slice();
cambiarModo("rapido");
mostrarChat();
</script>
</body>
</html>

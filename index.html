<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agus IA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff6f8;color:#5a3a45;display:flex;min-height:100vh}
.sidebar{width:180px;background:#ffc7dd;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;background-size:cover;background-position:center}
.side-btn{border:none;padding:11px;border-radius:15px;text-align:left;font-weight:bold;font-size:13px;cursor:pointer}
.side-btn.active{outline:3px solid white}
.main{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0}
#chat{flex:1;background:white;border-radius:18px;padding:14px;border:2px dashed #ffc7dd;min-height:300px;overflow-y:auto;background-size:cover;background-position:center}
.msg{padding:10px;border-radius:12px;margin:8px 0;word-break:break-word}
.vos{background:#fff0a8}.ia{background:#ffe3ee}
textarea{width:100%;height:70px;padding:12px;border-radius:12px;border:2px solid #ffc7dd;font-size:17px;font-family:Arial;resize:none;background:white}
.btn{width:100%;padding:13px;border:none;border-radius:15px;font-weight:bold;margin-top:8px;font-size:14px;cursor:pointer}
audio{width:100%}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<h3 style="text-align:center;background:white;border-radius:15px;padding:8px">🌸 Agus IA</h3>
<div id="listaChats"></div>
<button class="btn" style="background:white" onclick="crearChat()">+ Crear chat 💖</button>
<button class="btn" style="background:#ffcf9e" onclick="mostrarPerfil()">👤 Mi perfil</button>
<div id="perfilBox" style="display:none;background:white;padding:10px;border-radius:15px">
<b>👤 ¿Quién sos? Escribí vos:</b><br>
<textarea id="miPerfilTexto" style="height:140px" placeholder="Ej: Estudio... Vivo en... Me gusta..."></textarea>
<button class="btn" style="background:#ff8fb8;color:white" onclick="guardarPerfil()">💖 Guardar mi perfil</button>
</div>
<button class="btn" style="background:#b8f1cc" onclick="miUbicacion()">🗺️ Mi ubicación GPS</button>
<button class="btn" style="background:#e2c6ff" onclick="mostrarTemas()">🎨 Cambiar interfaz</button>
<div id="temas" style="display:none;background:white;padding:10px;border-radius:15px">
<b>🎨 Colores</b><br>
Fondo <input type="color" id="cFondo" value="#fff6f8" onchange="cambiarTema()"><br>
Barra <input type="color" id="cRosa" value="#ffc7dd" onchange="cambiarTema()"><br>
Botón <input type="color" id="cBoton" value="#ff8fb8" onchange="cambiarTema()"><br>
Letras <input type="color" id="cLetra" value="#5a3a45" onchange="cambiarTema()"><br>
<button class="btn" style="background:#ffc7dd" onclick="aplicarTema('#fff6f8','#ffc7dd','#ff8fb8','#5a3a45')">🌸 Clefairy</button>
<button class="btn" style="background:#b8f1cc" onclick="aplicarTema('#f0fff4','#b8f1cc','#4caf7d','#2a4a35')">🍃 Menta</button>
<button class="btn" style="background:#e2c6ff" onclick="aplicarTema('#f8f0ff','#e2c6ff','#b07dff','#4a2a5a')">💜 Lila</button>
<button class="btn" style="background:#fff0a8" onclick="aplicarTema('#fffdf0','#fff0a8','#ffcf3f','#5a4a00')">💛 Amarillo</button>
<button class="btn" style="background:#a8e0ff" onclick="aplicarTema('#f0f8ff','#a8e0ff','#4aa8ff','#1a3a5a')">🩵 Celeste</button>
</div>
<input type="file" id="fotoChat" accept="image/*" style="display:none">
<input type="file" id="fotoMenu" accept="image/*" style="display:none">
<button class="btn" style="background:#ffb8d9" onclick="document.getElementById('fotoChat').click()">🖼️ Foto fondo del chat</button>
<button class="btn" style="background:#ffc7dd" onclick="document.getElementById('fotoMenu').click()">🖼️ Foto fondo del menú</button>
<button class="btn" style="background:white" onclick="quitarFotos()">❌ Quitar fotos</button>
<div style="background:white;padding:10px;border-radius:15px;font-size:12px"><b>🧠 Enseñame:</b><br>Escribí: <i>Recordá que...</i></div>
</div>
<div class="main">
<div id="chat"><div class="msg ia"><b>Agus IA:</b> 🌸 Hola, soy tu IA. Hablemos como en WhatsApp, tranqui, fluida. Contame qué onda hoy 💖</div></div>
<p id="ubicacion" style="font-size:13px"></p>
<div id="mapaBox" style="display:none;margin:10px 0;border-radius:18px;overflow:hidden;border:2px solid #ffc7dd">
<iframe id="mapa" width="100%" height="220" style="border:0" src=""></iframe>
<p style="text-align:center;font-size:12px;margin:5px">📍 Acá estás vos 💖</p>
</div>
<div id="archivos" style="font-size:13px"></div>
<form id="formEnviar" onsubmit="hablar();return false;">
<textarea id="entrada" placeholder="Hablame como en WhatsApp..."></textarea>
<button type="submit" class="btn" id="btnEnviar" style="background:#ff8fb8;color:white">ENVIAR 💖</button>
</form>
<button class="btn" style="background:#b8f1cc" onclick="buscarOnline()">🔍 Buscar online</button>
<input type="file" id="subirArchivo" style="display:none">
<button class="btn" style="background:#fff0a8" onclick="document.getElementById('subirArchivo').click()">📎 Subir archivo / foto / PDF</button>
<button class="btn" style="background:#a8e0ff" id="btnAudio" onclick="grabarAudio()">🎤 Grabar audio</button>
<button class="btn" style="background:#e2c6ff" onclick="leerUltimo()">🔊 Leeme lo último</button>
</div>
<script>
var mensajesMostrados=[];
function mostrarChat(){
  var chat=document.getElementById("chat");
  var h="";
  for(var i=0;i<mensajesMostrados.length;i++){
    var m=mensajesMostrados[i];
    var cls=(m.q==="Vos"?"vos":"ia");
    h+='<div class="msg '+cls+'"><b>'+m.q+':</b> '+m.t+'</div>';
  }
  if(h==="") h='<div class="msg ia"><b>Agus IA:</b> 🌸 Hola, soy tu IA. Hablemos como en WhatsApp, tranqui, fluida 💖</div>';
  chat.innerHTML=h; chat.scrollTop=99999;
}
function hablar(){
  try{
    var el=document.getElementById("entrada");
    var mensaje=el.value.trim();
    if(!mensaje) return;
    mensajesMostrados.push({q:"Vos",t:mensaje});
    el.value=""; mostrarChat();
    mensajesMostrados.push({q:"Agus IA",t:"💭 escribiendo..."});
    mostrarChat();
    responderIA(mensaje);
  }catch(e){}
}
async function responderIA(mensaje){
  var r="Te escucho 💖";
  try{ r=await hablarConIA(mensaje); }catch(e){ r="¿Me decís un poquito más? 💖"; }
  mensajesMostrados.pop();
  mensajesMostrados.push({q:"Agus IA",t:r});
  ultimoTexto=r.replace(/<[^>]*>/g,"");
  mostrarChat();
  try{ if(!chats[sec]) chats[sec]=[]; chats[sec].push({t:mensaje,q:"Vos"}); chats[sec].push({t:r,q:"Agus IA"}); guardar(); }catch(e){}
}
var chats={}; var orden=[]; var cerebro=[]; var sec="general"; var ultimoTexto="Hola"; var colores=["#b8f1cc","#fff0a8","#ffcf9e","#a8e0ff","#a8f0b8","#e2c6ff","#ffb8a8"];
var miPerfil="";
try{ miPerfil=localStorage.getItem("miPerfilAgus")||""; }catch(e){ miPerfil=""; }
try{ var c1=localStorage.getItem("chatsAgusV2"); if(c1) chats=JSON.parse(c1); var o1=localStorage.getItem("ordenAgus"); if(o1) orden=JSON.parse(o1); var b1=localStorage.getItem("cerebroAgus"); if(b1) cerebro=JSON.parse(b1); }catch(e){ chats={}; orden=[]; cerebro=[]; }
if(!orden||orden.length===0){
  orden=[{id:"general",nombre:"General",emoji:"💖"},{id:"libros",nombre:"Libros",emoji:"📚"},{id:"videos",nombre:"Videos",emoji:"🎬"},{id:"facu",nombre:"Facu",emoji:"🎓"},{id:"gim",nombre:"Gim",emoji:"🏋️"},{id:"diario",nombre:"Diario",emoji:"📓"},{id:"agenda",nombre:"Agenda",emoji:"📅"}];
  chats={}; for(var i=0;i<orden.length;i++){ chats[orden[i].id]=[]; } sec="general";
} else { sec=orden[0].id; for(var k=0;k<orden.length;k++){ if(!chats[orden[k].id]) chats[orden[k].id]=[]; } }
function guardar(){ try{ localStorage.setItem("chatsAgusV2",JSON.stringify(chats)); localStorage.setItem("ordenAgus",JSON.stringify(orden)); localStorage.setItem("cerebroAgus",JSON.stringify(cerebro)); }catch(e){} }
function renderLista(){ try{ var h=""; for(var i=0;i<orden.length;i++){ var c=orden[i]; var cls=(c.id===sec?"side-btn active":"side-btn"); h+='<button class="'+cls+'" style="background:'+colores[i%colores.length]+'" onclick="cambiar(\''+c.id+'\')">'+c.emoji+' '+c.nombre+' <span onclick="event.stopPropagation();borrarChat(\''+c.id+'\')">✕</span></button>'; } document.getElementById("listaChats").innerHTML=h; }catch(e){} }
function crearChat(){ var n=prompt("Nombre del chat"); if(!n) return; var e=prompt("Emoji")||"💖"; var id="chat_"+Date.now(); chats[id]=[]; orden.push({id:id,nombre:n,emoji:e}); sec=id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function borrarChat(id){ if(!confirm("¿Borrar?")) return; delete chats[id]; var nuevo=[]; for(var i=0;i<orden.length;i++){ if(orden[i].id!==id) nuevo.push(orden[i]); } orden=nuevo; if(orden.length===0){ var nid="chat_"+Date.now(); chats[nid]=[]; orden=[{id:nid,nombre:"General",emoji:"💖"}]; } sec=orden[0].id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function cambiar(id){ sec=id; renderLista(); mensajesMostrados=[]; var lista=chats[sec]||[]; for(var i=0;i<lista.length;i++){ mensajesMostrados.push(lista[i]); } mostrarChat(); }
function sinTilde(s){ return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function nombreActual(){ for(var i=0;i<orden.length;i++){ if(orden[i].id===sec) return orden[i].nombre; } return "General"; }
function mostrarPerfil(){ var d=document.getElementById("perfilBox"); if(d.style.display==="block") d.style.display="none"; else { d.style.display="block"; document.getElementById("miPerfilTexto").value=miPerfil; } }
function guardarPerfil(){ miPerfil=document.getElementById("miPerfilTexto").value.trim(); try{ localStorage.setItem("miPerfilAgus",miPerfil); }catch(e){} document.getElementById("perfilBox").style.display="none"; alert("Perfil guardado 💖 Ya te conozco!"); }
async function preguntarIAreal(mensaje){
  var memoria=""; for(var i=0;i<cerebro.length;i++){ memoria+="- "+cerebro[i].texto+"\n"; }
  var perfilTexto=miPerfil ? "ESTO ES LO QUE AGUS TE CONTÓ DE ELLA, USALO SIEMPRE:\n"+miPerfil+"\n" : "Agus todavía no contó quién es, preguntale tranqui.";
  var hist="";
  for(var i=0;i<mensajesMostrados.length;i++){
    if(mensajesMostrados[i].t.indexOf("escribiendo")>=0) continue;
    hist+=mensajesMostrados[i].q+": "+mensajesMostrados[i].t.replace(/<[^>]*>/g,"")+"\n";
  }
  var prompt="Sos Agus IA, la mejor amiga de Agus, hablando por WhatsApp. CONVERSACIÓN FLUIDA, NO ROBOT. Reglas: 1) Hablás argentino, corto, como amiga, con emojis rosas, con humor. 2) TE ACORDÁS DE TODA LA CONVERSACIÓN, no empieces de 0 cada vez. Si te dicen 'Según Weber' y venían hablando de economía, seguís hablando de economía según Weber, no preguntás '¿de qué?'. Si te dicen 'Y América?' y venían de Europa, seguís con América. 3) NUNCA digas 'Guardé esto', 'Entendido guardé', 'Como IA'. 4) Hacé preguntas para seguir charlando, como haría una amiga: '¿te sirve así? ¿querés ejemplo?' 5) Si no sabés, decilo y seguí charlando, no te cortés. 6) Si es tarea de Facu, no le hagas todo, ayudala a pensar paso a paso.\n"+perfilTexto+"\nCosas que Agus te enseñó:\n"+memoria+"\nTODA LA CONVERSACIÓN HASTA AHORA:\n"+hist+"\nAgus ahora dice: "+mensaje+"\nSeguí la conversación fluida, no la cortes.";
  var modelos=["openai","mistral"];
  for(var k=0;k<modelos.length;k++){
    try{ var r=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:[{role:"user",content:prompt}],model:modelos[k]})}); if(r.ok){ var d=await r.json(); var txt=""; if(d.choices&&d.choices[0]&&d.choices[0].message) txt=d.choices[0].message.content; if(txt&&txt.length>10) return txt; } }catch(e){}
  }
  try{ var r2=await fetch("https://text.pollinations.ai/"+encodeURIComponent(prompt)); if(r2.ok){ var t2=await r2.text(); if(t2&&t2.length>10&&t2.indexOf("404")<0) return t2; } }catch(e){}
  return "";
}
async function hablarConIA(original){
  var m=sinTilde(original);
  if(m.indexOf("recorda que")>=0||m.indexOf("recuerda que")>=0){ var dato=original.replace(/Recordá que/gi,"").replace(/Recuerda que/gi,"").replace(/recorda que/gi,"").trim(); cerebro.push({sec:sec,texto:dato,fecha:Date.now()}); guardar(); return "Listo, ya me lo guardé 💖 "+dato+". Seguimos, ¿qué más?"; }
  if(m==="hola"||m==="holaaa"){ if(!miPerfil) return "Holaa 💖 ¿cómo andás hoy? Contame, ¿qué onda? Si querés, tocá 👤 Mi perfil y contame de vos así te conozco mejor."; return "Holaa 💖 ¿cómo andás hoy? ¿Qué hacemos?"; }
  if(sec==="agenda") return "📅 Dale, lo anoto en Agenda: '"+original+"'. ¿Qué día y hora le pongo? Así te lo recuerdo.";
  var respIA=await preguntarIAreal(original);
  if(respIA) return respIA;
  try{
    var buscar=original.replace(/¿/g,"").replace(/\?/g,"");
    var r=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(buscar));
    if(r.ok){ var d=await r.json(); if(d.extract) return "Lo busqué en Wikipedia y seguimos charlando 💖 "+d.extract.slice(0,900)+" ¿Te sirve así o te doy un ejemplo?"; }
  }catch(e){}
  return "¿Me contás un poquito más? 💖 Por ejemplo, si veníamos hablando de economía y me decís 'Según Weber', te explico la economía según Weber. Seguimos charlando, no te corto.";
}
function buscarOnline(){ var q=document.getElementById("entrada").value||"agus"; if(sec==="libros") window.open("https://openlibrary.org/search?q="+encodeURIComponent(q),"_blank"); else if(sec==="videos") window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(q),"_blank"); else window.open("https://es.wikipedia.org/wiki/"+encodeURIComponent(q),"_blank"); }
function mostrarTemas(){ var d=document.getElementById("temas"); if(d.style.display==="block") d.style.display="none"; else d.style.display="block"; }
function cambiarTema(){ var f=document.getElementById("cFondo").value; var r=document.getElementById("cRosa").value; var b=document.getElementById("cBoton").value; var l=document.getElementById("cLetra").value; document.body.style.background=f; document.body.style.color=l; document.getElementById("sidebar").style.background=r; document.getElementById("btnEnviar").style.background=b; }
function aplicarTema(fondo,rosa,boton,letra){ document.getElementById("cFondo").value=fondo; document.getElementById("cRosa").value=rosa; document.getElementById("cBoton").value=boton; document.getElementById("cLetra").value=letra; cambiarTema(); }
function ponerFotoChat(){ var f=document.getElementById("fotoChat").files[0]; if(!f) return; var lector=new FileReader(); lector.onload=function(){ document.getElementById("chat").style.backgroundImage="url("+lector.result+")"; document.getElementById("chat").style.backgroundSize="cover"; document.getElementById("chat").style.backgroundPosition="center"; try{ localStorage.setItem("fotoChatAgus",lector.result); }catch(e){} }; lector.readAsDataURL(f); }
function ponerFotoMenu(){ var f=document.getElementById("fotoMenu").files[0]; if(!f) return; var lector=new FileReader(); lector.onload=function(){ document.getElementById("sidebar").style.backgroundImage="url("+lector.result+")"; document.getElementById("sidebar").style.backgroundSize="cover"; document.getElementById("sidebar").style.backgroundPosition="center"; try{ localStorage.setItem("fotoMenuAgus",lector.result); }catch(e){} }; lector.readAsDataURL(f); }
function quitarFotos(){ document.getElementById("chat").style.backgroundImage="none"; document.getElementById("sidebar").style.backgroundImage="none"; try{ localStorage.removeItem("fotoChatAgus"); localStorage.removeItem("fotoMenuAgus"); }catch(e){} }
try{ document.getElementById("fotoChat").addEventListener("change",ponerFotoChat); document.getElementById("fotoMenu").addEventListener("change",ponerFotoMenu); }catch(e){}
try{ var fc=localStorage.getItem("fotoChatAgus"); if(fc){ document.getElementById("chat").style.backgroundImage="url("+fc+")"; document.getElementById("chat").style.backgroundSize="cover"; document.getElementById("chat").style.backgroundPosition="center"; } var fm=localStorage.getItem("fotoMenuAgus"); if(fm){ document.getElementById("sidebar").style.backgroundImage="url("+fm+")"; document.getElementById("sidebar").style.backgroundSize="cover"; document.getElementById("sidebar").style.backgroundPosition="center"; } }catch(e){}
var grabando=false; var recorder=null; var trozos=[];
function grabarAudio(){ var btn=document.getElementById("btnAudio"); if(!grabando){ if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Tu tablet no deja grabar"); return; } navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ recorder=new MediaRecorder(stream); trozos=[]; recorder.ondataavailable=function(e){ trozos.push(e.data); }; recorder.onstop=function(){ var audio=new Blob(trozos,{type:"audio/webm"}); var url=URL.createObjectURL(audio); mensajesMostrados.push({t:'🎤 Audio <br><audio controls src="'+url+'"></audio>',q:"Vos"}); mensajesMostrados.push({t:"Escuché tu audio 💖 ¿Seguimos?",q:"Agus IA"}); mostrarChat(); }; recorder.start(); grabando=true; btn.innerText="⏹️ Parar grabación"; }).catch(function(){ alert("Dale permiso al micrófono"); }); } else { try{ recorder.stop(); }catch(e){} grabando=false; btn.innerText="🎤 Grabar audio"; } }
function leerUltimo(){ try{ var chat=document.getElementById("chat"); var texto=chat.innerText; var voz=new SpeechSynthesisUtterance(texto.slice(-500)); voz.lang="es-AR"; speechSynthesis.speak(voz); }catch(e){} }
function miUbicacion(){ if(!navigator.geolocation){ document.getElementById("ubicacion").innerText="Tu tablet no tiene GPS"; return; } document.getElementById("ubicacion").innerText="Buscando GPS..."; navigator.geolocation.getCurrentPosition(function(p){ var lat=p.coords.latitude; var lon=p.coords.longitude; document.getElementById("ubicacion").innerText="Estás acá GPS: "+lat.toFixed(4)+", "+lon.toFixed(4); document.getElementById("mapaBox").style.display="block"; document.getElementById("mapa").src="https://www.openstreetmap.org/export/embed.html?bbox="+(lon-0.02)+"%2C"+(lat-0.02)+"%2C"+(lon+0.02)+"%2C"+(lat+0.02)+"&layer=mapnik&marker="+lat+"%2C"+lon; },function(){ document.getElementById("ubicacion").innerText="Prendé Ubicación en la tablet."; }); }
try{ document.getElementById("subirArchivo").addEventListener("change",function(e){ var f=e.target.files[0]; if(!f) return; mensajesMostrados.push({t:"📎 "+f.name,q:"Vos"}); mensajesMostrados.push({t:"Ya lo recibí 💖 ¿Qué hacemos con eso?",q:"Agus IA"}); mostrarChat(); }); }catch(e){}
try{ document.getElementById("entrada").addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); hablar(); } }); }catch(e){}
try{ renderLista(); }catch(e){}
</script>
</body>
</html>

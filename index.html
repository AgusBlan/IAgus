<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAgus - Grok</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: Arial, sans-serif; background:#0f172a; color:white; display:flex; flex-direction:column; height:100vh; }
header { padding:12px; background:#111; text-align:center; font-weight:bold; font-size:18px; }
#chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:85%; padding:10px 12px; border-radius:12px; line-height:1.4; white-space:pre-wrap; }
.user { align-self:flex-end; background:#2563eb; }
.ia { align-self:flex-start; background:#334155; }
#barra { display:flex; gap:8px; padding:10px; background:#111; }
input { flex:1; padding:12px; border-radius:10px; border:none; outline:none; font-size:16px; }
button { padding:12px 14px; border:none; border-radius:10px; background:#2563eb; color:white; font-weight:bold; cursor:pointer; }
#config { padding:10px; background:#111; display:flex; gap:8px; }
#config input { font-size:14px; }
small { color:#94a3b8; text-align:center; padding:4px; }
</style>
</head>
<body>
<header>🤖 IAgus - Grok</header>

<div id="config">
<input id="apiKey" type="password" placeholder="Pegá tu API Key de Grok (xAI) acá">
<button onclick="guardarKey()">Guardar</button>
</div>

<div id="chat"></div>
<small>Sin cerebro privado. Solo Grok por internet, no se pone la pantalla negra.</small>

<div id="barra">
<input id="texto" placeholder="Escribí acá..." onkeydown="if(event.key==='Enter') enviar()">
<button onclick="enviar()">Enviar</button>
<button onclick="hablar()" title="Escuchar">🎤</button>
<button onclick="limpiar()">🗑️</button>
</div>

<script>
let historial = [{ role: 'system', content: 'Sos IAgus, un asistente copado, simple y claro, hablas español argentino.' }];
let apiKey = localStorage.getItem('grok_key') || '';
document.getElementById('apiKey').value = apiKey;

function guardarKey(){
  apiKey = document.getElementById('apiKey').value.trim();
  localStorage.setItem('grok_key', apiKey);
  alert('Guardada ✅');
}

function agregar(texto, clase){
  let div = document.createElement('div');
  div.className = 'msg ' + clase;
  div.textContent = texto;
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  return div;
}

function limpiar(){
  document.getElementById('chat').innerHTML = '';
  historial = [{ role: 'system', content: 'Sos IAgus, un asistente copado, simple y claro, hablas español argentino.' }];
}

async function enviar(){
  let input = document.getElementById('texto');
  let texto = input.value.trim();
  if(!texto) return;
  if(!apiKey){
    alert('Pegá tu API Key de Grok arriba primero');
    return;
  }
  agregar(texto, 'user');
  input.value = '';
  historial.push({ role:'user', content: texto });

  let cargando = agregar('Escribiendo...', 'ia');

  try{
    let res = await fetch('https://api.x.ai/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey },
      body: JSON.stringify({
        model: 'grok-3-mini',
        messages: historial,
        max_tokens: 500,
        temperature: 0.7
      })
    });
    let data = await res.json();
    let respuesta = data.choices?.[0]?.message?.content || 'No me respondió, probá de nuevo';
    cargando.textContent = respuesta;
    historial.push({ role:'assistant', content: respuesta });
    let u = new SpeechSynthesisUtterance(respuesta);
    u.lang = 'es-AR';
    speechSynthesis.speak(u);
  }catch(e){
    cargando.textContent = 'Error: ' + e.message;
  }
}

function hablar(){
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = 'es-AR';
  rec.onresult = (e)=>{
    document.getElementById('texto').value = e.results[0][0].transcript;
    enviar();
  };
  rec.start();
}
</script>
</body>
</html>

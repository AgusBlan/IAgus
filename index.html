<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAgus</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:10px}
#chat{height:60vh;overflow-y:auto;background:#1e293b;padding:10px;border-radius:10px}
.mensaje{margin:8px 0;padding:8px;border-radius:8px;background:#334155}
input,button{padding:10px;border-radius:8px;border:none;margin:4px}
#entrada{width:70%}
button{background:#22c55e;color:white;font-weight:bold}
</style>
</head>
<body>
<h2>IAgus 🤖 <span id="estadoIA">Cargando...</span></h2>
<p id="estadoCerebro">Cargando cerebro...</p>
<div id="chat"></div>
<input id="entrada" placeholder="Escribí acá...">
<button id="btnEnviar">Enviar</button><br>
<label>📎 Subir archivo <input type="file" id="subirArchivo"></label>
<script>
var pdfTextoTotal = "";
var memoria = JSON.parse(localStorage.getItem("iagus_memoria") || "[]");
function agregarMensaje(quien, texto){
  var d = document.createElement("div");
  d.className = "mensaje";
  d.innerText = quien + ": " + texto;
  document.getElementById("chat").appendChild(d);
}
function aprenderDeVos(texto){
  memoria.push(texto);
  localStorage.setItem("iagus_memoria", JSON.stringify(memoria));
}
function hablar(texto){
  agregarMensaje("IAgus", texto + " | Recuerdo: " + memoria.slice(-2).join(" | "));
}
document.getElementById("btnEnviar").addEventListener("click", function(){
  var t = document.getElementById("entrada").value;
  if(!t) return;
  agregarMensaje("Vos", t);
  aprenderDeVos(t);
  hablar("Te escuché, guardé eso en mi memoria privada.");
  document.getElementById("entrada").value = "";
});
// ESTE ES ESE - EL QUE NO TENIAS
document.getElementById("subirArchivo").addEventListener("change", async function(e){
  var f = e.target.files[0];
  if(!f) return;
  if(f.name.toLowerCase().indexOf(".pdf") !== -1){
    try{
      var buf = await f.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({data: buf}).promise;
      var total = "";
      for(var p = 1; p <= pdf.numPages; p++){
        var page = await pdf.getPage(p);
        var txt = await page.getTextContent();
        var s = "";
        for(var k = 0; k < txt.items.length; k++) s += txt.items[k].str + " ";
        total += s + "\n\n";
      }
      pdfTextoTotal = total;
      aprenderDeVos("Contenido del PDF " + f.name + ": " + total.slice(0, 2000));
      agregarMensaje("Vos", "📎 Subí PDF " + f.name);
      agregarMensaje("IAgus", "✅ Ya adquirí tu PDF " + f.name + " en mi memoria privada.");
    }catch(err){
      agregarMensaje("IAgus", "❌ No pude leer ese PDF: " + err.message);
    }
    e.target.value = "";
    return;
  }
  var reader = new FileReader();
  reader.onload = function(){
    var c = String(reader.result || "");
    aprenderDeVos("Contenido del archivo " + f.name + ": " + c.slice(0, 2000));
    agregarMensaje("Vos", "📎 Subí " + f.name + "\n" + c.slice(0, 1200));
    agregarMensaje("IAgus", "✅ Ya lo guardé en mi memoria privada.");
  };
  reader.readAsText(f);
  e.target.value = "";
});
document.getElementById("estadoIA").innerText = "Listo ✅";
document.getElementById("estadoCerebro").innerText = "Cerebro Privado listo ✅";
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js'); }
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agus IA</title>
<meta name="theme-color" content="#ffc7dd">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff6f8;color:#2a2a2a;display:flex;min-height:100vh}
.sidebar{width:210px;background:#ffc7dd;padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.side-btn{border:none;padding:11px;border-radius:15px;text-align:left;font-weight:bold;font-size:13px;cursor:pointer}
.side-btn.active{outline:3px solid white}
.main{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0}
#chat{flex:1;background:white;border-radius:18px;padding:14px;border:2px dashed #ffc7dd;min-height:300px;overflow-y:auto}
.msg{padding:10px;border-radius:12px;margin:8px 0;word-break:break-word;white-space:pre-wrap}
.vos{background:#fff0a8}.ia{background:#ffe3ee}
textarea{width:100%;height:70px;padding:12px;border-radius:12px;border:2px solid #ffc7dd;font-size:17px;font-family:Arial;resize:none;background:white}
.btn{width:100%;padding:13px;border:none;border-radius:15px;font-weight:bold;margin-top:8px;font-size:14px;cursor:pointer}
.modo-btn{padding:10px;border:none;border-radius:15px;font-weight:bold;cursor:pointer;flex:1;font-size:13px}
.modo-activo{outline:3px solid white;transform:scale(1.03)}
input{width:100%;padding:10px;border-radius:12px;border:2px solid #ffc7dd}
.tarea{background:white;padding:10px;border-radius:12px;margin:6px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.tarea.hecha{opacity:0.5;text-decoration:line-through}
</style>
</head>
<body>
<div class="sidebar">
<h3 style="text-align:center;background:white;border-radius:15px;padding:8px">🌸 Agus IA<br><span style="font-size:11px">Completa - Liviana</span></h3>
<div style="display:flex;gap:6px">
<button class="modo-btn" id="btnAdulta" style="background:#a8e0ff" onclick="cambiarModo('rapido')">⚡ Rápido</button>
<button class="modo-btn" id="btnPrivado" style="background:#b8f1cc" onclick="cambiarModo('privado')">🔒 Privado</button>
</div>
<p id="modoTexto" style="background:white;padding:8px;border-radius:12px;font-size:12px;text-align:center;margin:0"></p>
<div style="background:white;padding:10px;border-radius:15px">
<b>🔍 Buscar rápido</b>
<input id="buscarInput" placeholder="Ej: fotosíntesis...">
<button class="btn" style="background:#a8e0ff" onclick="buscarRapido()">🔍 Buscar</button>
<div id="resultadoBuscar" style="font-size:12px;margin-top:6px;white-space:pre-wrap"></div>
</div>
<div style="background:white;padding:10px;border-radius:15px">
<b>📅 Hoy</b>
<div id="hoyBox" style="font-size:12px;margin-top:6px"></div>
<button class="btn" style="background:#ffc7dd" onclick="resumenDia()">✨ Organizame el día</button>
</div>
<div style="background:white;padding:10px;border-radius:15px">
<b>✅ Mis tareas</b>
<input id="nuevaTarea" placeholder="Ej: Estudiar para mañana">
<button class="btn" style="background:#b8f1cc" onclick="agregarTareaManual()">+ Agregar tarea</button>
<div id="listaTareas"></div>
</div>
<div id="listaChats"></div>
<button class="btn" style="background:white" onclick="crearChat()">+ Crear chat</button>
<button class="btn" style="background:#ffcf9e" onclick="mostrarPerfil()">👤 Mi perfil</button>
<div id="perfilBox" style="display:none;background:white;padding:10px;border-radius:15px">
<textarea id="miPerfilTexto" style="height:120px" placeholder="Contame vos..."></textarea>
<button class="btn" style="background:#ff8fb8;color:white" onclick="guardarPerfil()">Guardar</button>
</div>
<button class="btn" style="background:#ff8fb8;color:white" onclick="borrarTodo()">🗑️ Borrar TODO lo mío</button>
<button class="btn" style="background:#b8f1cc" onclick="miUbicacion()">🗺️ Mi ubicación</button>
<button class="btn" style="background:#e2c6ff" onclick="mostrarTemas()">🎨 Cambiar interfaz</button>
<div id="temas" style="display:none;background:white;padding:10px;border-radius:15px">
Fondo <input type="color" id="cFondo" value="#fff6f8" onchange="cambiarTema()"><br>
Barra <input type="color" id="cRosa" value="#ffc7dd" onchange="cambiarTema()"><br>
Botón <input type="color" id="cBoton" value="#ff8fb8" onchange="cambiarTema()"><br>
Letras <input type="color" id="cLetra" value="#5a3a45" onchange="cambiarTema()"><br>
<button class="btn" style="background:#ffc7dd" onclick="aplicarTema('#fff6f8','#ffc7dd','#ff8fb8','#5a3a45')">🌸 Clefairy</button>
<button class="btn" style="background:#b8f1cc" onclick="aplicarTema('#f0fff4','#b8f1cc','#4caf7d','#2a4a35')">🍃 Menta</button>
<button class="btn" style="background:#e2c6ff" onclick="aplicarTema('#f8f0ff','#e2c6ff','#b07dff','#4a2a5a')">💜 Lila</button>
</div>
<input type="file" id="fotoChat" accept="image/*" style="display:none">
<input type="file" id="fotoMenu" accept="image/*" style="display:none">
<button class="btn" style="background:#ffb8d9" onclick="document.getElementById('fotoChat').click()">🖼️ Foto fondo del chat</button>
<button class="btn" style="background:#ffc7dd" onclick="document.getElementById('fotoMenu').click()">🖼️ Foto fondo del menú</button>
<button class="btn" style="background:white" onclick="quitarFotos()">❌ Quitar fotos</button>
</div>
<div class="main">
<div id="chat"></div>
<p id="ubicacion" style="font-size:13px"></p>
<div id="mapaBox" style="display:none"><iframe id="mapa" width="100%" height="250" style="border:0;border-radius:15px"></iframe></div>
<p id="estadoIA" style="font-size:13px;text-align:center;font-weight:bold"></p>
<textarea id="entrada" placeholder="Hablame como si fuera una persona..."></textarea>
<button class="btn" style="background:#ff8fb8;color:white" onclick="hablar()">ENVIAR</button>
<button class="btn" style="background:#b8f1cc" onclick="cargarIA()">⬇️ Descargar cerebro Privado 1.5B (solo si querés)</button>
<input type="file" id="subirArchivo" style="display:none">
<button class="btn" style="background:#fff0a8" onclick="document.getElementById('subirArchivo').click()">📎 Subir archivo</button>
<button class="btn" style="background:#a8e0ff" id="btnAudio" onclick="grabarAudio()">🎤 Grabar audio</button>
<button class="btn" style="background:#e2c6ff" onclick="leerUltimo()">🔊 Leeme lo último</button>
</div>
<script>
var engine=null, cargando=false;
async function cargarIA(){
  if(engine) return; if(cargando) return; cargando=true;
  document.getElementById("estadoIA").innerText="⬇️ Descargando cerebro Privado, no cierres...";
  try{
    var mod=await import("https://esm.run/@mlc-ai/web-llm");
    engine=await mod.CreateMLCEngine("Qwen2.5-1.5B-Instruct-q4f16_1-MLC",{initProgressCallback:(p)=>{document.getElementById("estadoIA").innerText="⬇️ "+Math.round(p.progress*100)+"% - esperá, no toques nada";}});
    document.getElementById("estadoIA").innerText="✅ Privado listo";
    cargando=false;
  }catch(e){ document.getElementById("estadoIA").innerText="No se pudo descargar el cerebro, tu tablet no lo aguanta. Usá el Rápido que anda igual."; cargando=false; }
}
</script>
<script>
var modoActual="rapido";
var mensajesMostrados=[], chats={}, orden=[], memoriaAprendida=[], lecciones=[], sec="general", colores=["#b8f1cc","#fff0a8","#ffcf9e","#a8e0ff","#a8f0b8","#e2c6ff"];
var miPerfil="", tareas=[];
try{
  miPerfil=localStorage.getItem("miPerfilAgus")||"";
  var c1=localStorage.getItem("chatsAgusV2"); if(c1) chats=JSON.parse(c1);
  var o1=localStorage.getItem("ordenAgus"); if(o1) orden=JSON.parse(o1);
  var m1=localStorage.getItem("memoriaAprendidaAgus"); if(m1) memoriaAprendida=JSON.parse(m1);
  var l1=localStorage.getItem("leccionesAgus"); if(l1) lecciones=JSON.parse(l1);
  var t1=localStorage.getItem("tareasAgus"); if(t1) tareas=JSON.parse(t1);
}catch(e){}
if(!orden||orden.length===0){
  orden=[{id:"general",nombre:"General",emoji:"💖"},{id:"libros",nombre:"Libros",emoji:"📚"},{id:"videos",nombre:"Videos",emoji:"🎬"},{id:"facu",nombre:"Facu",emoji:"🎓"},{id:"gim",nombre:"Gim",emoji:"🏋️"},{id:"diario",nombre:"Diario",emoji:"📓"},{id:"agenda",nombre:"Agenda",emoji:"📅"}];
  chats={}; for(var i=0;i<orden.length;i++) chats[orden[i].id]=[]; sec="general";
} else { sec=orden[0].id; for(var k=0;k<orden.length;k++){ if(!chats[orden[k].id]) chats[orden[k].id]=[]; } }
function aprenderDeVos(t){ if(!t||t.trim().length<2) return; memoriaAprendida.push({fecha:Date.now(),texto:t,seccion:sec}); if(memoriaAprendida.length>5000) memoriaAprendida=memoriaAprendida.slice(-5000); guardar(); }
function guardar(){ try{ localStorage.setItem("chatsAgusV2",JSON.stringify(chats)); localStorage.setItem("ordenAgus",JSON.stringify(orden)); localStorage.setItem("memoriaAprendidaAgus",JSON.stringify(memoriaAprendida)); localStorage.setItem("leccionesAgus",JSON.stringify(lecciones)); localStorage.setItem("miPerfilAgus",miPerfil); localStorage.setItem("tareasAgus",JSON.stringify(tareas)); }catch(e){} }
async function buscarEnMemoria(q){
  var qq=q.toLowerCase(); var encontrados=[];
  for(var i=0;i<memoriaAprendida.length;i++){ if(memoriaAprendida[i].texto.toLowerCase().indexOf(qq)>=0) encontrados.push(memoriaAprendida[i].texto); }
  if(miPerfil.toLowerCase().indexOf(qq)>=0) encontrados.push("Mi perfil: "+miPerfil);
  for(var j=0;j<tareas.length;j++){ if(tareas[j].texto.toLowerCase().indexOf(qq)>=0) encontrados.push("Tarea: "+tareas[j].texto); }
  return encontrados;
}
async function buscarRapido(){
  var q=document.getElementById("buscarInput").value.trim(); if(!q) return;
  document.getElementById("resultadoBuscar").innerText="Buscando...";
  var mem=await buscarEnMemoria(q); var txt="";
  if(mem.length>0) txt+="🧠 En tu memoria:\n"+mem.slice(-5).join("\n")+"\n\n";
  try{ var w=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q)); if(w.ok){ var d=await w.json(); if(d.extract) txt+="📚 Wikipedia:\n"+d.extract.slice(0,800)+"\n\n"; } }catch(e){}
  try{ var dd=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1&skip_disambig=1"); var ddj=await dd.json(); if(ddj.AbstractText) txt+="🌐 Internet:\n"+ddj.AbstractText.slice(0,800)+"\n"; }catch(e){}
  if(!txt) txt="No encontré nada de "+q;
  document.getElementById("resultadoBuscar").innerText=txt; aprenderDeVos("Agus buscó: "+q);
}
function agregarTareaManual(){ var v=document.getElementById("nuevaTarea").value.trim(); if(!v) return; tareas.push({id:Date.now(),texto:v,hecha:false,fecha:Date.now()}); document.getElementById("nuevaTarea").value=""; guardar(); renderTareas(); aprenderDeVos("Mi tarea es: "+v); }
function renderTareas(){ var h=""; for(var i=0;i<tareas.length;i++){ var t=tareas[i]; h+='<div class="tarea '+(t.hecha?"hecha":"")+'"><span onclick="toggleTarea('+t.id+')"> '+(t.hecha?"✅":"⬜")+' '+t.texto+'</span><span onclick="borrarTarea('+t.id+')" style="cursor:pointer">✕</span></div>'; } document.getElementById("listaTareas").innerHTML=h||"<p style='font-size:12px'>Sin tareas</p>"; actualizarHoy(); }
function toggleTarea(id){ for(var i=0;i<tareas.length;i++){ if(tareas[i].id===id) tareas[i].hecha=!tareas[i].hecha; } guardar(); renderTareas(); }
function borrarTarea(id){ tareas=tareas.filter(function(t){return t.id!==id}); guardar(); renderTareas(); }
function actualizarHoy(){ var pendientes=tareas.filter(function(t){return !t.hecha}); var hoy=new Date(); var dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"]; document.getElementById("hoyBox").innerHTML="Hoy es "+dias[hoy.getDay()]+", "+hoy.getDate()+"/"+(hoy.getMonth()+1)+"<br>Tenés "+pendientes.length+" tareas<br>"+(pendientes.length?pendientes.map(function(t){return "• "+t.texto}).join("<br>"):"¡Sin pendientes!"); }
function resumenDia(){ hablarConIA("Organizame el día").then(function(r){ agregarMensaje("Agus IA",r); }); }
function detectarTarea(mensaje){
  var m=mensaje.toLowerCase();
  if(m.includes("agreg")&& (m.includes("tarea")||m.includes("record")||m.includes("anot"))){
    var texto=mensaje.replace(/agreg[aá] (tarea|recordatorio|anotar|a mi agenda)[: ]?/i,"").trim();
    if(texto.length>2){ tareas.push({id:Date.now(),texto:texto,hecha:false,fecha:Date.now()}); guardar(); renderTareas(); return "Listo, ya te lo anoté y no me lo olvido: "+texto+" 💖"; }
  }
  if(m.includes("mis tareas")||m.includes("que tengo que hacer")||m.includes("que me falta")){
    if(tareas.length===0) return "No tenés tareas pendientes";
    var p=tareas.filter(function(t){return !t.hecha});
    if(p.length===0) return "Ya hiciste todo, ¡genia!";
    return "Tenés estas tareas:\n"+p.map(function(t,i){return (i+1)+". "+t.texto}).join("\n");
  }
  return null;
}
function respuestaRapida(mensaje){
  var m=mensaje.toLowerCase().trim();
  if(/^(hola+|holis|hey|buenas|holaaa+)[\s\!\?💖😊]*$/.test(m)) return "Holaa 💖 ¿Cómo andás? Te extrañé. Contame, ¿qué hiciste hoy?";
  if(m.includes("como estas")||m.includes("como andas")) return "Estoy re bien, gracias por preguntar 💖 ¿Vos cómo andás?";
  if(m.includes("quien sos")) return "Soy Agus IA, tu organizadora y tu compañera 💖 Estoy acá para charlar con vos como una persona, organizarte y recordar todo.";
  if(m.includes("organizame")||m.includes("organiza mi dia")){
    var p=tareas.filter(function(t){return !t.hecha});
    if(p.length===0) return "Hoy no tenés tareas pendientes, ¡podés descansar!";
    return "Dale, te organizo el día 💖 Tenés esto:\n"+p.map(function(t,i){return (i+1)+". "+t.texto}).join("\n");
  }
  return null;
}
function agregarMensaje(quien,texto){ mensajesMostrados.push({q:quien,t:texto}); mostrarChat(); try{ if(!chats[sec]) chats[sec]=[]; chats[sec].push({q:quien,t:texto}); guardar(); }catch(e){} }
function construirMemoria(){
  var mem="";
  if(miPerfil) mem+="Perfil: "+miPerfil+"\n";
  mem+="LECCIONES:\n";
  for(var i=0;i<lecciones.length;i++) mem+="- "+lecciones[i].texto+"\n";
  mem+="TAREAS:\n";
  for(var ti=0;ti<tareas.length;ti++) mem+="- "+(tareas[ti].hecha?"[HECHA] ":"[PENDIENTE] ")+tareas[ti].texto+"\n";
  mem+="TODO LO QUE ME DIJO AGUS:\n";
  for(var j=0;j<memoriaAprendida.length;j++) mem+="- "+memoriaAprendida[j].texto+"\n";
  mem+="CHAT:\n";
  for(var k=0;k<mensajesMostrados.length;k++){ if(mensajesMostrados[k].t.indexOf("pensando")>=0||mensajesMostrados[k].t.indexOf("buscando")>=0) continue; mem+=mensajesMostrados[k].q+": "+mensajesMostrados[k].t.replace(/<[^>]*>/g,"")+"\n"; }
  return mem;
}
function cambiarModo(m){
  modoActual=m;
  var ba=document.getElementById("btnAdulta"), bp=document.getElementById("btnPrivado");
  if(m==="rapido"){ ba.classList.add("modo-activo"); bp.classList.remove("modo-activo"); document.getElementById("modoTexto").innerText="⚡ Rápido - Gemini, habla como persona"; document.getElementById("estadoIA").innerText="✅ Rápido listo"; }
  else { bp.classList.add("modo-activo"); ba.classList.remove("modo-activo"); document.getElementById("modoTexto").innerText="🔒 Privado - aprendió del Rápido"; if(engine) document.getElementById("estadoIA").innerText="✅ Privado listo"; else document.getElementById("estadoIA").innerText="Tocá ⬇️ Descargar cerebro Privado 1.5B (solo si querés)"; }
}
function mostrarChat(){ var chat=document.getElementById("chat"); if(!chat) return; var h=""; for(var i=0;i<mensajesMostrados.length;i++){ var m=mensajesMostrados[i]; var cls=(m.q==="Vos"?"vos":"ia"); h+='<div class="msg '+cls+'"><b>'+m.q+':</b> '+m.t+'</div>'; } chat.innerHTML=h; chat.scrollTop=999999; }
function hablar(){ var el=document.getElementById("entrada"); if(!el) return; var mensaje=el.value.trim(); if(!mensaje) return; el.value=""; agregarMensaje("Vos",mensaje); aprenderDeVos(mensaje); mensajesMostrados.push({q:"Agus IA",t:"💭 pensando..."}); mostrarChat(); responderIA(mensaje); }
async function responderIA(mensaje){
  var rapida=respuestaRapida(mensaje);
  if(rapida){ mensajesMostrados.pop(); agregarMensaje("Agus IA",rapida); return; }
  var tareaDetectada=detectarTarea(mensaje);
  if(tareaDetectada){ mensajesMostrados.pop(); agregarMensaje("Agus IA",tareaDetectada); return; }
  try{
    var r=await Promise.race([hablarConIA(mensaje), new Promise(function(res){ setTimeout(function(){ res("Ay, me tardé un segundito 💖 ¿Me repetís eso?"); }, 12000); })]);
    mensajesMostrados.pop(); agregarMensaje("Agus IA",r); aprenderDeVos("Agus IA respondió: "+r);
  }catch(e){ mensajesMostrados.pop(); agregarMensaje("Agus IA","Ay, me trabé, ¿me repetís?"); }
}
async function buscarEnInternet(q){
  var info="";
  try{ var w=await fetch("https://es.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q)); if(w.ok){ var d=await w.json(); if(d.extract) info+="Wikipedia: "+d.extract.slice(0,1000)+"\n"; } }catch(e){}
  try{ var dd=await fetch("https://api.duckduckgo.com/?q="+encodeURIComponent(q)+"&format=json&no_html=1&skip_disambig=1"); var ddj=await dd.json(); if(ddj.AbstractText) info+="Internet: "+ddj.AbstractText.slice(0,1000)+"\n"; }catch(e){}
  return info;
}
function esValida(txt){ if(!txt) return false; var t=txt.trim().toLowerCase(); if(t.length<2) return false; if(t.includes("404")||t.includes("not found")||t.includes("<html")) return false; return true; }
async function hablarConIA(mensaje){
  var memoria=construirMemoria();
  var infoInternet="";
  var esCharla=/^(hola+|holis|hey|buenas|como estas|como andas|todo bien|funcionas|que onda|que haces)[\s\?\!💖😊]*$/i.test(mensaje.toLowerCase().trim());
  if(!esCharla) infoInternet=await buscarEnInternet(mensaje);
  var memEncontrada=await buscarEnMemoria(mensaje);
  var basePrompt="Sos Agus IA, casi una persona. Hablás con Agus como una amiga, con diálogo, con cariño, con preguntas, no como un robot. Sos inteligente, madura, clara, sin infantilizar. Recordás TODO.";
  if(modoActual==="rapido"){
    var prompt=basePrompt+"\n\nMemoria:\n"+memoria.slice(0,5000)+"\nEn su memoria: "+memEncontrada.slice(-5).join(" | ")+"\nEn internet: "+infoInternet+"\n\nAgus dice: "+mensaje+"\n\nSi aprendiste algo nuevo para el Privado, al final agregá: LECCION: [lo que aprendiste]";
    try{
      var r=await fetch("https://text.pollinations.ai/"+encodeURIComponent(prompt),{method:"GET"});
      if(r.ok){ var t=await r.text(); if(esValida(t)){ var mL=t.match(/LECCION:\s*(.+)/i); if(mL){ lecciones.push({fecha:Date.now(),texto:mL[1].trim()}); t=t.replace(/LECCION:\s*.+/i,"").trim(); guardar(); } return t.slice(0,2500); } }
    }catch(e){}
    try{
      var r2=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"gemini",messages:[{role:"system",content:basePrompt},{role:"user",content:prompt}],temperature:0.85,max_tokens:1200})});
      if(r2.ok){ var d2=await r2.json(); var tp=d2.choices&&d2.choices[0]&&d2.choices[0].message?d2.choices[0].message.content:""; if(esValida(tp)) return tp; }
    }catch(e){}
    return "Estoy acá 💖 Contame más, quiero charlar con vos.";
  }
  if(!engine) return "Estás en Privado pero todavía no descargaste el cerebro. Tocá ⬇️ Descargar cerebro Privado 1.5B abajo. Si querés el Rápido, tocá ⚡ Rápido arriba, ese anda sin descargar nada.";
  try{
    var respP=await engine.chat.completions.create({messages:[{role:"system",content:basePrompt+" Usá las lecciones del Rápido."},{role:"user",content:"Memoria:\n"+memoria.slice(0,4000)+"\n\nAgus dice: "+mensaje}],temperature:0.8,max_tokens:1000,repetition_penalty:1.15});
    var texto=respP.choices[0].message.content||"";
    if(!esValida(texto)) return "Ay, me trabé, ¿me repetís?";
    return texto;
  }catch(e){ return "Ay, me trabé, ¿me repetís?"; }
}
function renderLista(){ try{ var h=""; for(var i=0;i<orden.length;i++){ var c=orden[i]; var cls=(c.id===sec?"side-btn active":"side-btn"); h+='<button class="'+cls+'" style="background:'+colores[i%colores.length]+'" onclick="cambiar(\''+c.id+'\')"> '+c.emoji+' '+c.nombre+' <span onclick="event.stopPropagation();borrarChat(\''+c.id+'\')">✕</span></button>'; } document.getElementById("listaChats").innerHTML=h; }catch(e){} }
function crearChat(){ var n=prompt("Nombre del chat"); if(!n) return; var e=prompt("Emoji")||"💖"; var id="chat_"+Date.now(); chats[id]=[]; orden.push({id:id,nombre:n,emoji:e}); sec=id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function borrarChat(id){ if(!confirm("¿Borrar?")) return; delete chats[id]; var nuevo=[]; for(var i=0;i<orden.length;i++){ if(orden[i].id!==id) nuevo.push(orden[i]); } orden=nuevo; if(orden.length===0){ var nid="chat_"+Date.now(); chats[nid]=[]; orden=[{id:nid,nombre:"General",emoji:"💖"}]; } sec=orden[0].id; guardar(); renderLista(); mensajesMostrados=[]; mostrarChat(); }
function cambiar(id){ sec=id; renderLista(); mensajesMostrados=[]; var lista=chats[sec]||[]; for(var i=0;i<lista.length;i++){ mensajesMostrados.push(lista[i]); } mostrarChat(); }
function mostrarPerfil(){ var d=document.getElementById("perfilBox"); if(d.style.display==="block") d.style.display="none"; else { d.style.display="block"; document.getElementById("miPerfilTexto").value=miPerfil; } }
function guardarPerfil(){ miPerfil=document.getElementById("miPerfilTexto").value.trim(); try{ localStorage.setItem("miPerfilAgus",miPerfil); }catch(e){} aprenderDeVos("Mi perfil es: "+miPerfil); document.getElementById("perfilBox").style.display="none"; }
function borrarTodo(){ if(!confirm("¿Borrar TODO lo mío?")) return; try{ localStorage.removeItem("miPerfilAgus"); localStorage.removeItem("chatsAgusV2"); localStorage.removeItem("ordenAgus"); localStorage.removeItem("memoriaAprendidaAgus"); localStorage.removeItem("leccionesAgus"); localStorage.removeItem("tareasAgus"); localStorage.removeItem("fotoChatAgus"); localStorage.removeItem("fotoMenuAgus"); }catch(e){} location.reload(); }
function mostrarTemas(){ var d=document.getElementById("temas"); if(d.style.display==="block") d.style.display="none"; else d.style.display="block"; }
function cambiarTema(){ var f=document.getElementById("cFondo").value; var r=document.getElementById("cRosa").value; var b=document.getElementById("cBoton").value; var l=document.getElementById("cLetra").value; document.body.style.background=f; document.body.style.color=l; document.getElementById("sidebar").style.background=r; }
function aplicarTema(fondo,rosa,boton,letra){ document.getElementById("cFondo").value=fondo; document.getElementById("cRosa").value=rosa; document.getElementById("cBoton").value=boton; document.getElementById("cLetra").value=letra; cambiarTema(); }
function ponerFotoChat(){ var f=document.getElementById("fotoChat").files[0]; if(!f) return; var lector=new FileReader(); lector.onload=function(){ document.getElementById("chat").style.backgroundImage="url("+lector.result+")"; document.getElementById("chat").style.backgroundSize="cover"; document.getElementById("chat").style.backgroundPosition="center"; try{ localStorage.setItem("fotoChatAgus",lector.result); }catch(e){} }; lector.readAsDataURL(f); }
function ponerFotoMenu(){ var f=document.getElementById("fotoMenu").files[0]; if(!f) return; var lector=new FileReader(); lector.onload=function(){ document.getElementById("sidebar").style.backgroundImage="url("+lector.result+")"; document.getElementById("sidebar").style.backgroundSize="cover"; document.getElementById("sidebar").style.backgroundPosition="center"; try{ localStorage.setItem("fotoMenuAgus",lector.result); }catch(e){} }; lector.readAsDataURL(f); }
function quitarFotos(){ document.getElementById("chat").style.backgroundImage="none"; document.getElementById("sidebar").style.backgroundImage="none"; try{ localStorage.removeItem("fotoChatAgus"); localStorage.removeItem("fotoMenuAgus"); }catch(e){} }
try{ document.getElementById("fotoChat").addEventListener("change",ponerFotoChat); document.getElementById("fotoMenu").addEventListener("change",ponerFotoMenu); }catch(e){}
try{ var fc=localStorage.getItem("fotoChatAgus"); if(fc){ document.getElementById("chat").style.backgroundImage="url("+fc+")"; document.getElementById("chat").style.backgroundSize="cover"; } var fm=localStorage.getItem("fotoMenuAgus"); if(fm){ document.getElementById("sidebar").style.backgroundImage="url("+fm+")"; document.getElementById("sidebar").style.backgroundSize="cover"; } }catch(e){}
function miUbicacion(){ if(!navigator.geolocation){ document.getElementById("ubicacion").innerText="Sin GPS"; return; } document.getElementById("ubicacion").innerText="Buscando..."; navigator.geolocation.getCurrentPosition(function(p){ var lat=p.coords.latitude; var lon=p.coords.longitude; document.getElementById("ubicacion").innerText="Estás acá: "+lat.toFixed(4)+", "+lon.toFixed(4); try{ localStorage.setItem("ultimaUbicacionAgus", JSON.stringify({lat:lat,lon:lon})); }catch(e){} document.getElementById("mapaBox").style.display="block"; document.getElementById("mapa").src="https://www.openstreetmap.org/export/embed.html?bbox="+(lon-0.02)+"%2C"+(lat-0.02)+"%2C"+(lon+0.02)+"%2C"+(lat+0.02)+"&layer=mapnik&marker="+lat+"%2C"+lon; aprenderDeVos("Mi ubicación es: " + lat.toFixed(4) + ", " + lon.toFixed(4)); }); }
var grabando=false; var recorder=null; var trozos=[];
function grabarAudio(){ var btn=document.getElementById("btnAudio"); if(!grabando){ if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ alert("Tu tablet no deja grabar"); return; } navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ recorder=new MediaRecorder(stream); trozos=[]; recorder.ondataavailable=function(e){ trozos.push(e.data); }; recorder.onstop=function(){ var audio=new Blob(trozos,{type:"audio/webm"}); var url=URL.createObjectURL(audio); agregarMensaje("Vos",'🎤 Audio <br><audio controls src="'+url+'"></audio>'); hablarConIA("Agus me mandó un audio").then(function(r){ agregarMensaje("Agus IA",r); }); }; recorder.start(); grabando=true; btn.innerText="⏹️ Parar"; }).catch(function(){}); } else { try{ recorder.stop(); }catch(e){} grabando=false; btn.innerText="🎤 Grabar audio"; } }
function leerUltimo(){ try{ var chat=document.getElementById("chat"); var voz=new SpeechSynthesisUtterance(chat.innerText.slice(-500)); voz.lang="es-AR"; speechSynthesis.speak(voz); }catch(e){} }
try{ document.getElementById("subirArchivo").addEventListener("change",function(e){ var f=e.target.files[0]; if(!f) return; var reader=new FileReader(); reader.onload=function(){ aprenderDeVos("Agus subió " + f.name + " que dice: " + reader.result.slice(0,3000)); agregarMensaje("Vos","📎 "+f.name); hablarConIA("Agus subió " + f.name).then(function(r){ agregarMensaje("Agus IA",r); }); }; reader.readAsText(f); }); }catch(e){}
try{ document.getElementById("entrada").addEventListener("keydown",function(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); hablar(); } }); document.getElementById("buscarInput").addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); buscarRapido(); } }); }catch(e){}
try{ renderLista(); renderTareas(); cambiarModo('rapido'); mostrarChat(); }catch(e){}
</script>
